<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상상을 현실로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   상상을 현실로 — 세 번째 판

   본질(재우 정리, 2026-08-26):
     아이디어를 눈에 보이는 구조로 정리하고, 그 구조를 보면서 생각하고,
     전체를 조망하면서 현실화해간다.
     구조화 자체가 생각하는 과정의 일부다.

   그래서 이 판이 지키는 것 셋:
     1. 모드가 없다.
        「본다 → 생각한다 → 바꾼다 → 다시 본다」가 한 덩어리다.
        보고 있는 그 줄을 그 자리에서 고친다. 편집 창을 따로 열지 않는다.
     2. 바꾸는 데 벌칙이 없다.
        옮겨도 아무것도 끊기지 않는다. 아래 달린 것은 따라온다.
        (첫 판은 층을 옮기면 이어둔 선이 전부 끊겨서, 생각을 바꾸는 행동에 벌칙을 줬다)
     3. 전체가 사라지지 않는다.
        들어갔다 나오는 게 아니라 제자리에서 펼쳐진다.
        그래서 「이 부분이 전체에서 어디인지」를 따로 알려줄 필요가 없다.
   =========================================================================== */

:root{
  --paper:#FBFAF7; --card:#FFFFFF; --sunk:#F2F1EC;
  --ink:#191B18; --ink2:#5A5F57; --ink3:#8D9188; --ink4:#B4B8AF;
  --line:#E5E4DD; --line2:#D0D0C7;
  --think:#B08A3E;   /* 💭 아직 생각 중 */
  --set:#4B7BB5;     /* ✓ 정했음 */
  --made:#2E8A50;    /* ■ 만들어짐 */
  --focus:#F5F3E9;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:14px; line-height:1.5; overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:inherit}
.hidden{display:none !important}

.btn{
  border:1px solid var(--line2);background:var(--card);border-radius:8px;
  padding:6px 12px;font-size:12.5px;font-weight:500;white-space:nowrap;
}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}

.screen{position:fixed;inset:0;display:none;flex-direction:column}
body[data-at="list"] #list{display:flex}
body[data-at="work"] #work{display:flex}

/* =============================== 목록 =============================== */
#list{overflow-y:auto}
.lwrap{width:min(760px,92vw);margin:0 auto;padding:56px 0 90px}
.ltitle{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:0 0 5px}
.lsub{color:var(--ink3);font-size:13px;margin:0 0 32px}
.jot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.jot h3{margin:0 0 4px;font-size:14px;font-weight:600}
.jot p{margin:0 0 11px;color:var(--ink3);font-size:12px}
.jot textarea{
  width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);
  border-radius:9px;padding:11px 12px;background:var(--paper);outline:none;line-height:1.7;
}
.jot textarea:focus{border-color:var(--line2);background:#fff}
.jotfoot{display:flex;align-items:center;gap:10px;margin-top:10px}
.jotfoot .tip{flex:1;color:var(--ink3);font-size:11.5px}

.lsect{margin-top:36px}
.lsect h4{display:flex;align-items:center;gap:8px;margin:0 0 11px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.lsect h4 .sp{flex:1}
.pj{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:13px 15px;margin-bottom:8px;
}
.pj:hover{border-color:var(--line2)}
.pj .nm{font-weight:600;font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj .mini{display:flex;gap:9px;font-size:12px;color:var(--ink3);flex:0 0 auto}
.pj .mini b{font-weight:600}
.pjx{color:var(--ink4);padding:2px 6px;border-radius:5px;flex:0 0 auto}
.pjx:hover{background:var(--sunk);color:var(--ink)}
.none{border:1px dashed var(--line2);border-radius:11px;padding:22px;text-align:center;color:var(--ink3);font-size:13px}

/* =============================== 작업 화면 =============================== */
#work{overflow:hidden}

/* 조망 머리 — 「내가 무엇을 만들고 있는지」와 「어디까지 왔는지」 */
.hd{
  display:flex;align-items:center;gap:12px;padding:13px 22px;
  border-bottom:1px solid var(--line);background:var(--card);flex:0 0 auto;
}
.hd .t{font-size:16px;font-weight:600;letter-spacing:-.01em;border:1px solid transparent;
  padding:3px 7px;border-radius:7px;outline:none;max-width:46vw;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.hd .t:hover{background:var(--sunk)}
.hd .t:focus{background:#fff;border-color:var(--line2)}
.hd .sp{flex:1}
.tally{display:flex;align-items:center;gap:13px;font-size:12.5px;color:var(--ink2);flex:0 0 auto}
.tally span{display:flex;align-items:center;gap:5px}
.tally i{width:8px;height:8px;border-radius:2px;display:block}
.i-think{background:var(--think);border-radius:50%}
.i-set{background:var(--set)}
.i-made{background:var(--made)}

/* 전체 진행 — 조망의 「어디까지 만들었는지」 */
.gauge{height:3px;background:var(--sunk);flex:0 0 auto}
.gauge i{display:block;height:100%;background:var(--made);transition:width .25s}

/* 구조판. 이 화면 하나가 전부다 */
.sheet{flex:1;min-height:0;overflow-y:auto;padding:22px 0 26vh}
.inner{width:min(880px,94vw);margin:0 auto}

.row{
  position:relative;display:flex;align-items:flex-start;gap:9px;
  border-radius:9px;padding:5px 8px 5px 6px;margin-bottom:1px;
}
.row:hover{background:var(--sunk)}
.row.on{background:var(--focus)}
/* 지금 보는 줄의 조상. 「이 부분이 전체에서 어디에 속하는지」를 따로 안 알려줘도 되게 */
.row.anc{background:rgba(0,0,0,.022)}
.row.anc .nm{color:var(--ink)}

/* 펼침 삼각형 */
.tw{
  width:15px;height:22px;flex:0 0 auto;display:grid;place-items:center;
  color:var(--ink4);font-size:9px;line-height:1;
}
.tw:hover{color:var(--ink2)}
.tw.leaf{visibility:hidden}
.tw.fold{color:var(--ink2)}

/* 상태 — 💭 생각 중 / ✓ 정했음 / ■ 만들어짐. 눌러서 돌린다 */
.st{
  width:22px;height:22px;flex:0 0 auto;display:grid;place-items:center;
  border-radius:6px;font-size:12px;line-height:1;
}
.st:hover{background:rgba(0,0,0,.06)}
.st.think{color:var(--think)}
.st.set{color:var(--set)}
.st.made{color:var(--made)}

.mid{flex:1;min-width:0}
.nm{
  outline:none;border-radius:5px;padding:1px 2px;min-height:22px;
  line-height:1.55;word-break:break-word;white-space:pre-wrap;
}
.nm:empty::before{content:attr(data-ph);color:var(--ink4)}
/* 생각은 붙어 있되, 보고 있는 줄이 아니면 한 줄로 접는다.
   안 접으면 첫 화면이 글 벽이 되어 전체 구성이 안 보인다(원칙 4). */
.note{
  color:var(--ink3);font-size:12.5px;line-height:1.6;outline:none;
  padding:1px 2px;margin-top:1px;white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
}
.note:empty{display:none}
.row.on .note{display:block;overflow:visible}
.row.on .note:empty{display:block}
.row.on .note:empty::before{content:"생각나는 것 (Shift+Enter 로 여기)";color:var(--ink4)}

/* 층에 따라 무게가 다르다. 계층을 강제하는 게 아니라 한눈에 크기를 읽히게 */
.d0 .nm{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.d1 .nm{font-size:14.5px;font-weight:500}
.d2 .nm{font-size:13.5px}
.d3 .nm,.d4 .nm,.d5 .nm{font-size:13px;color:var(--ink2)}
.d0{margin-top:16px}
.d1{margin-top:2px}

/* 접힌 줄의 요약 — 접혀 있어도 안에 뭐가 있는지 안다 */
.sum{display:flex;align-items:center;gap:8px;flex:0 0 auto;font-size:11.5px;color:var(--ink3);padding-top:3px}
.sum .bar{width:44px;height:3px;border-radius:2px;background:var(--sunk);overflow:hidden}
.sum .bar i{display:block;height:100%;background:var(--made)}
.sum .q{color:var(--think);font-weight:600}
.row:hover .sum{color:var(--ink2)}

.deeper{margin-left:26px;border-left:1px solid var(--line);padding-left:2px}

.tip{
  display:flex;align-items:center;gap:16px;padding:8px 22px;flex:0 0 auto;
  border-top:1px solid var(--line);background:var(--card);
  font-size:11.5px;color:var(--ink3);overflow-x:auto;
}
.tip b{color:var(--ink2);font-weight:600}
.tip .sp{flex:1}
kbd{
  font-family:inherit;font-size:11px;background:var(--sunk);border:1px solid var(--line2);
  border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink2);
}

/* =============================== 겹창 =============================== */
.scrim{position:fixed;inset:0;background:rgba(20,22,20,.2);z-index:40;display:none}
.scrim.on{display:block}
.dlg{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;
  width:min(600px,94vw);max-height:84vh;background:var(--card);
  border:1px solid var(--line2);border-radius:14px;
  box-shadow:0 24px 60px -22px rgba(20,24,20,.45);
  display:none;flex-direction:column;
}
.dlg.on{display:flex}
.dlg h3{margin:0;padding:17px 20px 0;font-size:15px;font-weight:600}
.dlg .de{padding:7px 20px 0;color:var(--ink2);font-size:12.5px;line-height:1.6;white-space:pre-wrap}
.dlg .bd{padding:14px 20px 0;overflow-y:auto;flex:1;min-height:0}
.dlg .bd .origin{white-space:pre-wrap;font-size:13.5px;line-height:1.8;color:var(--ink)}
.dlg textarea{width:100%;min-height:170px;resize:vertical;border:1px solid var(--line);
  border-radius:9px;padding:10px 11px;background:var(--paper);outline:none;
  font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.6}
.dlg .ft{display:flex;gap:8px;justify-content:flex-end;padding:15px 20px 17px}
.dlg .ft .sp{flex:1}

.toast{
  position:fixed;left:50%;bottom:56px;transform:translate(-50%,12px);z-index:60;
  background:var(--ink);color:#fff;padding:10px 17px;border-radius:10px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body data-at="list">

<!-- ============================ 목록 ============================ -->
<div class="screen" id="list">
  <div class="lwrap">
    <h1 class="ltitle">상상을 현실로</h1>
    <p class="lsub">머릿속에 있는 걸 밖에 꺼내놓고, 보면서 생각하는 곳</p>

    <div class="jot">
      <h3>뭘 만들고 싶은가요?</h3>
      <p>줄바꿈만 해두면 그게 그대로 첫 뼈대가 됩니다. 정리해서 쓰지 않아도 됩니다.</p>
      <textarea id="jotIn" placeholder="이명 겪는 사람용 건기식 몰&#10;상세페이지&#10;리뷰 모으기&#10;가격은 아직 모르겠음"></textarea>
      <div class="jotfoot">
        <span class="tip">Ctrl+Enter</span>
        <button class="btn pri" id="jotGo">꺼내놓기</button>
      </div>
    </div>

    <div class="lsect">
      <h4>지금 굴리는 것 <span class="sp"></span>
        <button class="btn ghost sm" id="btnImport">첫 판에서 가져오기</button>
        <button class="btn ghost sm" id="btnBackup">백업</button>
        <button class="btn ghost sm" id="btnRestore">되살리기</button>
      </h4>
      <div id="pjList"></div>
    </div>
  </div>
</div>

<!-- ============================ 작업 화면 ============================ -->
<div class="screen" id="work">
  <div class="hd">
    <button class="btn ghost sm" id="toList">← 목록</button>
    <div class="t" id="pjTitle" contenteditable="plaintext-only" spellcheck="false"></div>
    <span class="sp"></span>
    <div class="tally" id="tally"></div>
    <button class="btn ghost sm" id="btnOrigin">처음 적은 글</button>
    <button class="btn ghost sm" id="btnAll">모두 펼치기</button>
  </div>
  <div class="gauge"><i id="gauge"></i></div>

  <div class="sheet" id="sheet"><div class="inner" id="inner"></div></div>

  <div class="tip">
    <span><kbd>Enter</kbd> 새 줄</span>
    <span><kbd>Tab</kbd> 안으로 · <kbd>Shift+Tab</kbd> 밖으로</span>
    <span><kbd>Alt+↑↓</kbd> 순서</span>
    <span><kbd>Shift+Enter</kbd> 생각 적기</span>
    <span><kbd>Ctrl+Enter</kbd> 💭→✓→■</span>
    <span class="sp"></span>
    <span><b>옮겨도 아무것도 끊기지 않습니다.</b> 아래 달린 것은 따라옵니다</span>
  </div>
</div>

<!-- ============================ 겹창 ============================ -->
<div class="scrim" id="scrim"></div>
<div class="dlg" id="dlg">
  <h3 id="dTitle"></h3>
  <div class="de" id="dDesc"></div>
  <div class="bd" id="dBody"></div>
  <div class="ft">
    <span class="sp"></span>
    <button class="btn" id="dNo">닫기</button>
    <button class="btn pri" id="dYes">확인</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ===========================================================================
   저장

   첫 판(설계도 캔버스)은 localStorage["sulgyedo.v3"] 를 쓴다.
   같은 file:// 이라 저장 칸을 공유하므로, 여기서 그 칸에 쓰면 원본이 덮인다.
   이 판은 자기 칸만 쓰고 첫 판 것은 읽기만 한다. 나란히 켜놓고 비교할 수 있어야 한다.
   =========================================================================== */
var KEY = "sangsang3", OLDKEY = "sulgyedo.v3";

/* 상태 셋. 본질 문장에서 그대로 나온 것이다 —
   「무엇이 아직 미정인지 / 무엇을 결정했는지 / 어디까지 만들었는지」  */
var STS = ["think","set","made"];
var SIGN = { think:"💭", set:"✓", made:"■" };
var LABEL= { think:"아직 생각 중", set:"정했음", made:"만들어짐" };

var APP = null;      /* {projects:[]} */
var PJ  = null;      /* 지금 열어둔 것 */
var CUR = null;      /* 커서가 있는 줄 id */

function uid(p){ return (p||"n") + Math.random().toString(36).slice(2,9); }
function now(){ return Date.now(); }

function mkNode(name, state){
  return { id:uid(), name:name||"", state:state||"think", note:"", kids:[], fold:false };
}
function stampNode(n){
  if(!n.id) n.id = uid();
  if(typeof n.name !== "string") n.name = "";
  if(STS.indexOf(n.state) < 0) n.state = "think";
  if(typeof n.note !== "string") n.note = "";
  if(!Array.isArray(n.kids)) n.kids = [];
  if(typeof n.fold !== "boolean") n.fold = false;
  n.kids.forEach(stampNode);
  return n;
}
function stampPj(p){
  if(!p.id) p.id = uid("p");
  if(typeof p.title !== "string" || !p.title) p.title = "이름 없는 것";
  if(typeof p.origin !== "string") p.origin = "";
  if(!Array.isArray(p.roots)) p.roots = [];
  p.roots.forEach(stampNode);
  if(!p.createdAt) p.createdAt = now();
  if(!p.updatedAt) p.updatedAt = now();
  return p;
}
function save(touch){
  if(!APP) return;
  if(PJ && touch !== false) PJ.updatedAt = now();
  try{ localStorage.setItem(KEY, JSON.stringify(APP)); }
  catch(e){ toast("저장하지 못했습니다 — " + e.message); }
}
function load(){
  try{
    var s = localStorage.getItem(KEY);
    if(s){ var a = JSON.parse(s); if(a && a.projects){ a.projects.forEach(stampPj); return a; } }
  }catch(e){}
  return null;
}

/* --------------------------- 나무 훑기 --------------------------- */
/* 부모를 가리키는 번호가 아니라 통째로 품는 구조다.
   그래야 옮길 때 아래 달린 것이 저절로 따라오고, 끊길 선이 아예 없다. */
function walk(list, fn, depth, parent){
  depth = depth || 0;
  (list||[]).forEach(function(n, i){
    fn(n, depth, list, i, parent || null);
    walk(n.kids, fn, depth + 1, n);
  });
}
function find(id){
  var hit = null;
  walk(PJ.roots, function(n, d, list, i, parent){
    if(n.id === id) hit = { node:n, depth:d, list:list, i:i, parent:parent };
  });
  return hit;
}
function countIn(n){
  var c = { think:0, set:0, made:0, total:0 };
  walk(n.kids, function(k){ c[k.state]++; c.total++; });
  return c;
}
function tallyAll(){
  var c = { think:0, set:0, made:0, total:0 };
  walk(PJ.roots, function(n){ c[n.state]++; c.total++; });
  return c;
}
/* 「어디까지 만들었는지」 — 안에 있는 것까지 포함해 만들어진 비율 */
function madeRate(n){
  var c = countIn(n);
  if(!c.total) return n.state === "made" ? 1 : 0;
  return c.made / c.total;
}

/* --------------------------- 화면 전환 --------------------------- */
function go(w){ document.body.dataset.at = w; }
function toast(m){
  var t = document.getElementById("toast");
  t.textContent = m; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("on"); }, 2600);
}

/* =========================================================================
   목록
   ========================================================================= */
function renderList(){
  var box = document.getElementById("pjList");
  box.innerHTML = "";
  if(!APP.projects.length){
    box.innerHTML = '<div class="none">아직 없습니다. 위 칸에 생각나는 대로 적어보세요.</div>';
    return;
  }
  APP.projects.slice().sort(function(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); })
    .forEach(function(p){
      var was = PJ; PJ = p;
      var c = tallyAll(); PJ = was;

      var wrap = document.createElement("div");
      wrap.style.position = "relative";
      var b = document.createElement("button"); b.className = "pj";
      var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = p.title;
      var mi = document.createElement("span"); mi.className = "mini";
      [["think",c.think],["set",c.set],["made",c.made]].forEach(function(x){
        if(!x[1]) return;
        var s = document.createElement("span");
        s.style.color = "var(--" + x[0] + ")";
        s.innerHTML = SIGN[x[0]] + " <b>" + x[1] + "</b>";
        mi.appendChild(s);
      });
      if(!c.total){ var e = document.createElement("span"); e.textContent = "비어 있음"; mi.appendChild(e); }
      b.appendChild(nm); b.appendChild(mi);
      b.onclick = function(){ open(p.id); };

      var x = document.createElement("button");
      x.className = "pjx"; x.textContent = "✕"; x.title = "지우기";
      x.style.cssText += "position:absolute;right:12px;top:14px";
      x.onclick = function(ev){
        ev.stopPropagation();
        dlg({ title:"「" + p.title + "」 지우기", desc:"되돌릴 수 없습니다.", yes:"지우기",
              run:function(){ APP.projects = APP.projects.filter(function(q){ return q.id !== p.id; });
                              save(false); renderList(); } });
      };
      wrap.appendChild(b); wrap.appendChild(x);
      box.appendChild(wrap);
    });
}

/* 적은 글을 그대로 첫 뼈대로 만든다.
   「밖으로 꺼낸다 → 대략적인 구조로 만든다」를 한 동작으로 붙였다.
   들여쓴 줄은 들여쓴 대로 안에 넣는다. 정리해서 쓸 필요가 없어야 한다. */
function fromText(text){
  var lines = String(text||"").split("\n");
  var roots = [], stack = [];
  lines.forEach(function(raw){
    if(!raw.trim()) return;
    var indent = (raw.match(/^[\t 　]*/)[0] || "");
    var depth = Math.floor(indent.replace(/\t/g, "  ").replace(/　/g, " ").length / 2);
    var name = raw.trim().replace(/^[-*•·]\s*/, "");
    var n = mkNode(name, "think");
    while(stack.length > depth) stack.pop();
    if(!stack.length){ roots.push(n); }
    else { stack[stack.length - 1].kids.push(n); }
    stack.push(n);
  });
  return roots;
}

/* =========================================================================
   작업 화면 — 이 화면 하나가 전부다
   ========================================================================= */
/* 열자마자 커서를 박지 않는다. 커서가 있는 줄은 생각까지 펼쳐지는데,
   그러면 열자마자 한 줄이 글 벽이 되어 전체 구성이 안 보인다.
   「본다 → 생각한다 → 바꾼다」 순서대로, 보는 게 먼저다. */
function open(id, focus){
  PJ = APP.projects.filter(function(p){ return p.id === id; })[0];
  if(!PJ) return;
  stampPj(PJ);
  CUR = null;
  go("work"); render();
  if(focus && PJ.roots.length) setTimeout(function(){ caretTo(PJ.roots[0].id, "end"); }, 40);
}

function render(){
  document.getElementById("pjTitle").textContent = PJ.title;

  var c = tallyAll();
  var tl = document.getElementById("tally");
  tl.innerHTML = "";
  STS.forEach(function(k){
    var s = document.createElement("span");
    s.style.color = c[k] ? "var(--" + k + ")" : "var(--ink4)";
    s.title = LABEL[k];
    s.textContent = SIGN[k] + " " + c[k];
    tl.appendChild(s);
  });
  document.getElementById("gauge").style.width =
    (c.total ? Math.round(c.made / c.total * 100) : 0) + "%";

  var inner = document.getElementById("inner");
  inner.innerHTML = "";
  if(!PJ.roots.length){
    PJ.roots.push(mkNode("", "think"));
    CUR = PJ.roots[0].id;
  }
  build(PJ.roots, inner, 0);
  markPath();
}

function build(list, host, depth){
  var box = host;
  if(depth > 0){ box = document.createElement("div"); box.className = "deeper"; host.appendChild(box); }
  list.forEach(function(n){
    box.appendChild(rowEl(n, depth));
    if(n.kids.length && !n.fold) build(n.kids, box, depth + 1);
  });
}

function rowEl(n, depth){
  var row = document.createElement("div");
  row.className = "row d" + Math.min(depth, 5) + (CUR === n.id ? " on" : "");
  row.dataset.id = n.id;

  /* 펼침 */
  var tw = document.createElement("button");
  tw.className = "tw" + (n.kids.length ? (n.fold ? " fold" : "") : " leaf");
  tw.textContent = n.fold ? "▶" : "▼";
  tw.title = n.fold ? "펼치기" : "접기";
  tw.onmousedown = function(e){ e.preventDefault(); };
  tw.onclick = function(){ n.fold = !n.fold; save(false); render(); };
  row.appendChild(tw);

  /* 상태 — 눌러서 돌린다. 창을 열지 않는다 */
  var st = document.createElement("button");
  st.className = "st " + n.state;
  st.textContent = SIGN[n.state];
  st.title = LABEL[n.state] + " — 눌러서 바꾸기";
  st.onmousedown = function(e){ e.preventDefault(); };
  st.onclick = function(){ cycle(n); };
  row.appendChild(st);

  /* 이름 — 보고 있는 그 자리에서 바로 고친다 */
  var mid = document.createElement("div"); mid.className = "mid";
  var nm = document.createElement("div");
  nm.className = "nm"; nm.contentEditable = "plaintext-only"; nm.spellcheck = false;
  nm.dataset.ph = depth === 0 ? "무엇을 만드나" : "무엇이 필요한가";
  nm.textContent = n.name;
  nm.addEventListener("input", function(){ n.name = nm.textContent; save(); });
  nm.addEventListener("focus", function(){ setCur(n.id); });
  nm.addEventListener("keydown", function(e){ onKey(e, n, "name"); });
  mid.appendChild(nm);

  /* 생각 — 같은 줄에 붙어 있다. 따로 열지 않는다 */
  var note = document.createElement("div");
  note.className = "note"; note.contentEditable = "plaintext-only"; note.spellcheck = false;
  note.textContent = n.note;
  note.addEventListener("input", function(){ n.note = note.textContent; save(); });
  note.addEventListener("focus", function(){ setCur(n.id); });
  note.addEventListener("keydown", function(e){ onKey(e, n, "note"); });
  mid.appendChild(note);
  row.appendChild(mid);

  /* 접혀 있어도 안에 뭐가 있는지 안다 */
  if(n.kids.length){
    var c = countIn(n);
    var sum = document.createElement("div"); sum.className = "sum";
    if(n.fold){
      var t = document.createElement("span");
      t.textContent = "안에 " + c.total + "개";
      sum.appendChild(t);
    }
    if(c.think){ var q = document.createElement("span"); q.className = "q"; q.textContent = "💭 " + c.think; sum.appendChild(q); }
    var bar = document.createElement("div"); bar.className = "bar";
    var bi = document.createElement("i"); bi.style.width = Math.round(madeRate(n) * 100) + "%";
    bar.appendChild(bi); sum.appendChild(bar);
    var r = document.createElement("span"); r.textContent = c.made + "/" + c.total;
    sum.appendChild(r);
    row.appendChild(sum);
  }
  return row;
}

/* 지금 줄과 그 조상을 표시한다.
   제자리에서 펼쳐지므로 「이 부분이 전체에서 어디인지」를 주소줄로 알려줄 필요가 없다. */
function markPath(){
  var path = {};
  (function dive(list, chain){
    list.forEach(function(n){
      if(n.id === CUR) chain.forEach(function(x){ path[x] = 1; });
      dive(n.kids, chain.concat([n.id]));
    });
  })(PJ.roots, []);
  document.querySelectorAll(".row").forEach(function(r){
    r.classList.toggle("anc", !!path[r.dataset.id]);
    r.classList.toggle("on", r.dataset.id === CUR);
  });
}
function setCur(id){ if(CUR === id) return; CUR = id; markPath(); }

function caretTo(id, where, field){
  var row = document.querySelector('.row[data-id="' + id + '"]');
  if(!row) return;
  var el = row.querySelector(field === "note" ? ".note" : ".nm");
  if(!el) return;
  el.focus();
  var r = document.createRange(), s = window.getSelection();
  r.selectNodeContents(el);
  r.collapse(where === "start");     /* collapse(true) 가 「맨 앞」이다. 뒤집어 쓰면 글 앞에 끼어 쓰인다 */
  s.removeAllRanges(); s.addRange(r);
  CUR = id; markPath();
  var rc = row.getBoundingClientRect(), sh = document.getElementById("sheet").getBoundingClientRect();
  if(rc.top < sh.top + 20 || rc.bottom > sh.bottom - 20) row.scrollIntoView({ block:"center" });
}

/* --------------------------- 구조 바꾸기 ---------------------------
   전부 그 자리에서 일어난다. 창이 열리지 않고, 아무것도 끊기지 않는다. */
function cycle(n){
  n.state = STS[(STS.indexOf(n.state) + 1) % 3];
  save(); render(); caretTo(n.id, "end");
}
function addAfter(n){
  var f = find(n.id); if(!f) return;
  var fresh = mkNode("", "think");
  /* 펼쳐진 채로 안에 뭐가 있으면, 새 줄은 그 안 맨 앞이 자연스럽다 */
  if(n.kids.length && !n.fold) n.kids.unshift(fresh);
  else f.list.splice(f.i + 1, 0, fresh);
  save(); render(); caretTo(fresh.id, "end");
}
function indent(n){
  var f = find(n.id); if(!f || f.i === 0) return;          /* 위 형제가 없으면 못 들어간다 */
  var prev = f.list[f.i - 1];
  f.list.splice(f.i, 1);
  prev.fold = false;
  prev.kids.push(n);                                       /* 아래 달린 것은 통째로 따라온다 */
  save(); render(); caretTo(n.id, "end");
}
function outdent(n){
  var f = find(n.id); if(!f || !f.parent) return;           /* 맨 바깥이면 그만 */
  var pf = find(f.parent.id); if(!pf) return;
  f.list.splice(f.i, 1);
  pf.list.splice(pf.i + 1, 0, n);
  save(); render(); caretTo(n.id, "end");
}
function moveUp(n){
  var f = find(n.id); if(!f || f.i === 0) return;
  f.list.splice(f.i, 1); f.list.splice(f.i - 1, 0, n);
  save(); render(); caretTo(n.id, "end");
}
function moveDown(n){
  var f = find(n.id); if(!f || f.i >= f.list.length - 1) return;
  f.list.splice(f.i, 1); f.list.splice(f.i + 1, 0, n);
  save(); render(); caretTo(n.id, "end");
}
function removeNode(n){
  var f = find(n.id); if(!f) return;
  if(f.list.length === 1 && !f.parent && !n.kids.length) return;   /* 마지막 한 줄은 남긴다 */
  var goTo = null;
  if(f.i > 0){ var p = f.list[f.i - 1]; goTo = lastOpen(p); }
  else if(f.parent) goTo = f.parent.id;
  else if(f.list[f.i + 1]) goTo = f.list[f.i + 1].id;
  /* 안에 있던 것은 버리지 않고 그 자리로 올린다 */
  var args = [f.i, 1].concat(n.kids);
  f.list.splice.apply(f.list, args);
  save(); render();
  if(goTo) caretTo(goTo, "end"); else if(PJ.roots[0]) caretTo(PJ.roots[0].id, "end");
}
function lastOpen(n){
  if(n.fold || !n.kids.length) return n.id;
  return lastOpen(n.kids[n.kids.length - 1]);
}
/* 눈에 보이는 순서 그대로 위아래로 옮겨 다닌다 */
function visible(){
  var out = [];
  (function dive(list){
    list.forEach(function(n){ out.push(n); if(n.kids.length && !n.fold) dive(n.kids); });
  })(PJ.roots);
  return out;
}
function step(n, dir){
  var v = visible(), i = -1;
  v.forEach(function(x, k){ if(x.id === n.id) i = k; });
  var t = v[i + dir];
  if(t) caretTo(t.id, "end");
}

function onKey(e, n, field){
  var meta = e.ctrlKey || e.metaKey;

  if(e.key === "Enter" && meta){ e.preventDefault(); cycle(n); return; }
  if(e.key === "Enter" && e.shiftKey){
    e.preventDefault();
    if(field === "name") caretTo(n.id, "end", "note");
    else caretTo(n.id, "end", "name");
    return;
  }
  if(e.key === "Enter"){ e.preventDefault(); addAfter(n); return; }

  if(e.key === "Tab"){
    e.preventDefault();
    if(e.shiftKey) outdent(n); else indent(n);
    return;
  }
  if(e.altKey && e.key === "ArrowUp"){ e.preventDefault(); moveUp(n); return; }
  if(e.altKey && e.key === "ArrowDown"){ e.preventDefault(); moveDown(n); return; }

  if(e.key === "ArrowUp" && !e.altKey){ e.preventDefault(); step(n, -1); return; }
  if(e.key === "ArrowDown" && !e.altKey){ e.preventDefault(); step(n, +1); return; }

  if(e.key === "Backspace" && field === "name" && !n.name && atStart()){
    e.preventDefault(); removeNode(n); return;
  }
  if(e.key === "Escape"){ e.preventDefault(); e.target.blur(); }
}
function atStart(){
  var s = window.getSelection();
  return s && s.isCollapsed && s.anchorOffset === 0;
}

var DLG = null;
function dlg(o){
  DLG = o;
  document.getElementById("dTitle").textContent = o.title || "";
  document.getElementById("dDesc").textContent = o.desc || "";
  var bd = document.getElementById("dBody");
  bd.innerHTML = "";
  if(o.html) bd.innerHTML = o.html;
  if(o.input){
    var ta = document.createElement("textarea");
    ta.id = "dTa"; ta.value = o.value || "";
    if(o.readonly) ta.readOnly = true;
    bd.appendChild(ta);
  }
  var yes = document.getElementById("dYes");
  yes.textContent = o.yes || "확인";
  yes.classList.toggle("hidden", o.yes === false);
  document.getElementById("dNo").textContent = o.no || "닫기";
  document.getElementById("dlg").classList.add("on");
  document.getElementById("scrim").classList.add("on");
  if(o.input) setTimeout(function(){ var t = document.getElementById("dTa"); t.focus(); if(o.readonly) t.select(); }, 50);
}
function dlgClose(){
  document.getElementById("dlg").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
  DLG = null;
}
function copy(t){
  function fb(){
    var ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).catch(fb);
  else fb();
}

/* =========================================================================
   첫 판에서 가져오기 — 읽기만 한다
   ========================================================================= */
function readOld(){
  try{
    var s = localStorage.getItem(OLDKEY);
    if(!s) return null;
    var a = JSON.parse(s);
    return (a && a.projects) ? a : null;
  }catch(e){ return null; }
}
function importOld(){
  var old = readOld();
  if(!old) return 0;
  var n = 0;
  (old.projects || []).forEach(function(op){
    var byId = {}, roots = [];
    (op.nodes || []).forEach(function(o){
      /* 상태 넷을 셋으로 옮긴다. 「만드는 중」은 아직 만들어진 게 아니므로 「정했음」이다 */
      var st = o.status === "done" ? "made"
             : (o.status === "set" || o.status === "doing") ? "set" : "think";
      var lines = [];
      (o.what ? [o.what] : []).forEach(function(t){ lines.push(t); });
      (o.decided || []).forEach(function(t){ lines.push("· " + t); });
      (o.open || []).forEach(function(t){ lines.push("? " + t); });   /* 하나도 안 버린다 */
      byId[o.id] = { id:o.id, name:o.name || "", state:st, note:lines.join("\n"), kids:[], fold:false };
    });
    (op.nodes || []).forEach(function(o){
      var me = byId[o.id];
      if(o.parent && byId[o.parent]) byId[o.parent].kids.push(me);
      else roots.push(me);
    });
    /* 열자마자 전부 펼쳐져 있으면 「전체가 대략 어떻게 구성되어 있는지」가 안 보인다.
       접어두고, 보고 싶은 곳만 펼치게 한다. 접혀 있어도 안에 뭐가 있는지는 요약으로 보인다. */
    (function foldAll(list){
      list.forEach(function(n){ if(n.kids.length){ n.fold = true; foldAll(n.kids); } });
    })(roots);
    var origin = [];
    if(op.what) origin.push(op.what);
    (op.open || []).forEach(function(t){ origin.push("? " + t); });
    APP.projects.push(stampPj({ title:op.title, origin:origin.join("\n"), roots:roots,
                                createdAt:op.createdAt, updatedAt:op.updatedAt }));
    n++;
  });
  (old.ideas || []).forEach(function(oi){
    var body = [oi.text || ""];
    (oi.notes || []).forEach(function(x){ body.push(typeof x === "string" ? x : (x && (x.t || x.text) || "")); });
    (oi.open || []).forEach(function(t){ body.push("? " + t); });
    var text = body.filter(Boolean).join("\n");
    APP.projects.push(stampPj({ title:oi.title || "쪽지", origin:text, roots:fromText(text) }));
    n++;
  });
  save(false);
  return n;
}

if(!APP){
