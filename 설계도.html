<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상상을 현실로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   상상을 현실로 — 네 번째 판

   형태를 이렇게 고른 근거 (전부 재우의 실제 발언·문서에서 나왔다):

   · 2026-08-21 21:57  글로 된 3단 구조를 보고
       "난감하다 / 직관적이진 않습니다 / 만다라트나 조직도, 마인드맵처럼 도식화나
        가시적인 이미지로 먼저 확인 가능했음 좋겠어요"
       → 읽어서 아는 형태(목록·아웃라이너)는 이미 한 번 거절당했다.
   · 2026-08-24 07:48  "프로젝트 전체 구조가 한눈에 들어오도록"
   · CLAUDE.md 원칙 15  Infinite canvas / Document manager 로 축소하지 말 것
       → 첫 판은 무한 캔버스(가로 6,948px)로, 세 번째 판은 문서 목록으로 각각 실패했다.

   셋을 동시에 만족하는 형태는 「담기는 상자」다.
     - 상자가 상자를 품으므로 선을 긋지 않아도 관계가 보인다
     - 면적을 나눠 가지므로 아무리 커져도 화면을 넘지 않는다
     - 안이 빽빽한지 비었는지가 글자를 읽기 전에 눈으로 들어온다

   그리고 앞 판에서 잘 나온 것은 그대로 살렸다.
     - 데이터를 통째로 품는 구조  → 옮겨도 아무것도 끊기지 않는다
     - 모드 없음                 → 보고 있는 그 자리에서 고친다
     - 상태 셋(상상→결정→현실)     → 「아직 안 정한 것」 별도 목록 없음
   =========================================================================== */

:root{
  --paper:#F7F6F2; --card:#FFFFFF; --sunk:#EFEEE9;
  --ink:#181A17; --ink2:#585D55; --ink3:#8B8F87; --ink4:#B2B6AD;
  --line:#E4E3DC; --line2:#CFCFC6;
  --think:#C08A2E;   /* 아직 생각 중 */
  --set:#4477B8;     /* 정했음 */
  --made:#2C8A4E;    /* 만들어짐 */
  --drop:#2C8A4E;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:14px;line-height:1.5;overflow:hidden;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:inherit}
.hidden{display:none !important}

.btn{border:1px solid var(--line2);background:var(--card);border-radius:8px;
  padding:6px 12px;font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:6px}

.screen{position:fixed;inset:0;display:none;flex-direction:column}
body[data-at="list"] #list{display:flex}
body[data-at="board"] #board{display:flex}

/* ================================ 목록 ================================ */
#list{overflow-y:auto}
.lwrap{width:min(760px,92vw);margin:0 auto;padding:54px 0 90px}
.ltitle{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:0 0 5px}
.lsub{color:var(--ink3);font-size:13px;margin:0 0 30px}
.jot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.jot h3{margin:0 0 4px;font-size:14px;font-weight:600}
.jot p{margin:0 0 11px;color:var(--ink3);font-size:12px}
.jot textarea{width:100%;min-height:112px;resize:vertical;border:1px solid var(--line);
  border-radius:9px;padding:11px 12px;background:var(--paper);outline:none;line-height:1.75;
  -webkit-user-select:text;user-select:text}
.jot textarea:focus{border-color:var(--line2);background:#fff}
.jotfoot{display:flex;align-items:center;gap:10px;margin-top:10px}
.jotfoot .tip{flex:1;color:var(--ink3);font-size:11.5px}

.lsect{margin-top:34px}
.lsect h4{display:flex;align-items:center;gap:8px;margin:0 0 11px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.lsect h4 .sp{flex:1}
.pj{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:13px 15px;margin-bottom:8px}
.pj:hover{border-color:var(--line2)}
.pj .nm{font-weight:600;font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj .mini{display:flex;gap:10px;font-size:12px;color:var(--ink3);flex:0 0 auto}
.pjx{position:absolute;right:12px;top:14px;color:var(--ink4);padding:2px 6px;border-radius:5px}
.pjx:hover{background:var(--sunk);color:var(--ink)}
.none{border:1px dashed var(--line2);border-radius:11px;padding:22px;text-align:center;color:var(--ink3);font-size:13px}

/* ============================== 조망판 ============================== */
#board{overflow:hidden}
.hd{display:flex;align-items:center;gap:10px;padding:11px 18px;
  border-bottom:1px solid var(--line);background:var(--card);flex:0 0 auto}
.path{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow:hidden}
.path button{padding:4px 8px;border-radius:6px;font-size:13px;color:var(--ink2);
  max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path button:hover{background:var(--sunk);color:var(--ink)}
.path .now{color:var(--ink);font-weight:600;cursor:default}
.path .now:hover{background:transparent}
.path .sep{color:var(--line2);font-size:11px}
.tally{display:flex;align-items:center;gap:12px;font-size:12.5px;flex:0 0 auto}
.tally span{display:flex;align-items:center;gap:5px;color:var(--ink2)}
.tally i{width:9px;height:9px;border-radius:3px;display:block}
.gauge{height:3px;background:var(--sunk);flex:0 0 auto}
.gauge i{display:block;height:100%;background:var(--made);transition:width .25s}

/* 이 칸이 이 제품의 전부다. 스크롤이 없다 — 내용이 늘면 안에서 나눠 갖는다 */
.stage{flex:1;min-height:0;position:relative;overflow:hidden;padding:16px}
.canvas{position:absolute;inset:16px}

/* 상자 */
.bx{
  position:absolute;background:var(--card);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;transition:box-shadow .12s,border-color .12s;
  border-left:3px solid var(--c,var(--line2));
}
.bx:hover{border-color:var(--line2);box-shadow:0 2px 10px -6px rgba(20,24,20,.35)}
.bx.sel{border-color:var(--ink);box-shadow:0 0 0 2px rgba(24,26,23,.10)}
.bx.drag{opacity:.35}
.bx.drop{border-color:var(--drop);box-shadow:0 0 0 2px rgba(44,138,78,.28)}
.bx.d1{border-radius:9px}
.bx.d2{border-radius:8px}

.bh{display:flex;align-items:center;gap:6px;padding:6px 8px 4px 8px;cursor:grab}
.bh:active{cursor:grabbing}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--c,var(--line2));cursor:pointer}
.dot:hover{box-shadow:0 0 0 3px rgba(0,0,0,.07)}
.nm{
  flex:1;min-width:0;outline:none;font-weight:600;font-size:14px;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:4px;padding:1px 3px;
  -webkit-user-select:text;user-select:text;cursor:text;
}
.nm:focus{background:var(--sunk);white-space:normal;overflow:visible}
.nm:empty::before{content:"이름";color:var(--ink4)}
.bx.d0 .nm{font-size:15.5px}
.bx.d1 .nm{font-size:13.5px;font-weight:500}
.bx.d2 .nm{font-size:12.5px;font-weight:500}
.mark{font-size:11px;color:var(--ink3);flex:0 0 auto;white-space:nowrap}
.mark b{font-weight:600;color:var(--ink2)}
.bar{width:34px;height:3px;border-radius:2px;background:var(--sunk);overflow:hidden;flex:0 0 auto}
.bar i{display:block;height:100%;background:var(--made)}
.zoom{color:var(--ink4);font-size:11px;padding:0 3px;border-radius:4px;flex:0 0 auto;opacity:0}
.bx:hover .zoom{opacity:1}
.zoom:hover{background:var(--sunk);color:var(--ink)}

.bnote{
  padding:0 10px 5px 10px;color:var(--ink3);font-size:11.5px;line-height:1.5;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  -webkit-user-select:text;user-select:text;outline:none;
}
.bnote:focus{-webkit-line-clamp:99;background:var(--sunk);border-radius:5px}

/* 작아지면 한 줄 칩으로, 더 작아지면 점으로 — 줄여서 보여주되 없애지 않는다 */
.chip{
  position:absolute;display:flex;align-items:center;gap:5px;background:var(--card);
  border:1px solid var(--line);border-left:3px solid var(--c,var(--line2));
  border-radius:7px;padding:0 7px;overflow:hidden;font-size:12px;color:var(--ink2);
}
.chip:hover{border-color:var(--line2)}
.chip .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  outline:none;-webkit-user-select:text;user-select:text;cursor:text}
.chip .n{font-size:10.5px;color:var(--ink4);flex:0 0 auto}
.chip.sel{border-color:var(--ink)}
.chip.drop{border-color:var(--drop);box-shadow:0 0 0 2px rgba(44,138,78,.28)}
.chip.drag{opacity:.35}
.pip{position:absolute;border-radius:50%;background:var(--c,var(--line2));cursor:pointer}
.pip:hover{box-shadow:0 0 0 3px rgba(0,0,0,.08)}

.plus{
  position:absolute;border:1px dashed var(--line2);border-radius:9px;color:var(--ink4);
  display:grid;place-items:center;font-size:12px;background:transparent;
}
.plus:hover{background:var(--sunk);color:var(--ink2)}

.empty{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  color:var(--ink3);font-size:13px;line-height:1.9;
}

.ft{display:flex;align-items:center;gap:14px;padding:7px 18px;flex:0 0 auto;
  border-top:1px solid var(--line);background:var(--card);font-size:11.5px;color:var(--ink3)}
.ft .sp{flex:1}
.ft b{color:var(--ink2);font-weight:600}

/* ============================== 겹창 ============================== */
.scrim{position:fixed;inset:0;background:rgba(18,20,18,.2);z-index:40;display:none}
.scrim.on{display:block}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;
  width:min(600px,94vw);max-height:84vh;background:var(--card);border:1px solid var(--line2);
  border-radius:14px;box-shadow:0 24px 60px -22px rgba(18,22,18,.45);display:none;flex-direction:column}
.dlg.on{display:flex}
.dlg h3{margin:0;padding:17px 20px 0;font-size:15px;font-weight:600}
.dlg .de{padding:7px 20px 0;color:var(--ink2);font-size:12.5px;line-height:1.6;white-space:pre-wrap}
.dlg .bd{padding:14px 20px 0;overflow-y:auto;flex:1;min-height:0}
.dlg .bd .origin{white-space:pre-wrap;font-size:13.5px;line-height:1.8;-webkit-user-select:text;user-select:text}
.dlg textarea{width:100%;min-height:170px;resize:vertical;border:1px solid var(--line);
  border-radius:9px;padding:10px 11px;background:var(--paper);outline:none;
  font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.6;
  -webkit-user-select:text;user-select:text}
.dlg .ft2{display:flex;gap:8px;justify-content:flex-end;padding:15px 20px 17px}
.dlg .ft2 .sp{flex:1}

.toast{position:fixed;left:50%;bottom:52px;transform:translate(-50%,12px);z-index:60;
  background:var(--ink);color:#fff;padding:10px 17px;border-radius:10px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body data-at="list">

<!-- ================================ 목록 ================================ -->
<div class="screen" id="list">
  <div class="lwrap">
    <h1 class="ltitle">상상을 현실로</h1>
    <p class="lsub">머릿속에 있는 걸 밖에 펼쳐놓고, 보면서 생각하는 곳</p>

    <div class="jot">
      <h3>뭘 만들고 싶은가요?</h3>
      <p>줄바꿈만 해두면 그게 그대로 첫 뼈대가 됩니다. 정리해서 쓰지 않아도 됩니다.</p>
      <textarea id="jotIn" placeholder="이명 겪는 사람용 건기식 몰&#10;상세페이지&#10;  사진 찍기&#10;  글 쓰기&#10;리뷰 모으기&#10;가격은 아직 모르겠음"></textarea>
      <div class="jotfoot">
        <span class="tip">Ctrl+Enter</span>
        <button class="btn pri" id="jotGo">펼쳐놓기</button>
      </div>
    </div>

    <div class="lsect">
      <h4>지금 굴리는 것<span class="sp"></span>
        <button class="btn ghost sm" id="btnImport">첫 판에서 가져오기</button>
        <button class="btn ghost sm" id="btnBackup">백업</button>
        <button class="btn ghost sm" id="btnRestore">되살리기</button>
      </h4>
      <div id="pjList"></div>
    </div>
  </div>
</div>

<!-- ================================ 조망판 ================================ -->
<div class="screen" id="board">
  <div class="hd">
    <button class="btn ghost sm" id="toList">← 목록</button>
    <nav class="path" id="path"></nav>
    <div class="tally" id="tally"></div>
    <button class="btn ghost sm" id="btnOrigin">처음 적은 글</button>
  </div>
  <div class="gauge"><i id="gauge"></i></div>
  <div class="stage" id="stage"><div class="canvas" id="canvas"></div></div>
  <div class="ft">
    <span>상자를 <b>끌어서 다른 상자에 넣으면</b> 그 안으로 · <b>위 주소줄에 떨구면</b> 그 층으로 꺼내집니다 — 아무것도 끊기지 않습니다</span>
    <span class="sp"></span>
    <span>글자를 눌러 바로 고치기 · 동그라미를 눌러 상태 바꾸기 · <b>⤢</b> 로 그 안만 크게</span>
  </div>
</div>

<!-- ================================ 겹창 ================================ -->
<div class="scrim" id="scrim"></div>
<div class="dlg" id="dlg">
  <h3 id="dTitle"></h3>
  <div class="de" id="dDesc"></div>
  <div class="bd" id="dBody"></div>
  <div class="ft2">
    <span class="sp"></span>
    <button class="btn" id="dNo">닫기</button>
    <button class="btn pri" id="dYes">확인</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ===========================================================================
   저장 — 첫 판과 저장 칸을 공유하므로(같은 file://) 자기 칸만 쓰고 첫 판 것은 읽기만 한다
   =========================================================================== */
var KEY = "sangsang4", OLDKEY = "sulgyedo.v3";

/* 상태 셋. 「무엇이 아직 미정인지 / 무엇을 결정했는지 / 어디까지 만들었는지」 그대로다 */
var STS = ["think","set","made"];
var LABEL = { think:"아직 생각 중", set:"정했음", made:"만들어짐" };
var COLOR = { think:"var(--think)", set:"var(--set)", made:"var(--made)" };

var APP=null, PJ=null, FOCUS=null, SEL=null;

function uid(p){ return (p||"n") + Math.random().toString(36).slice(2,9); }
function now(){ return Date.now(); }
function mkNode(name, state){ return { id:uid(), name:name||"", state:state||"think", note:"", kids:[] }; }

function stampNode(n){
  if(!n.id) n.id = uid();
  if(typeof n.name !== "string") n.name = "";
  if(STS.indexOf(n.state) < 0) n.state = "think";
  if(typeof n.note !== "string") n.note = "";
  if(!Array.isArray(n.kids)) n.kids = [];
  n.kids.forEach(stampNode);
  return n;
}
function stampPj(p){
  if(!p.id) p.id = uid("p");
  if(typeof p.title !== "string" || !p.title) p.title = "이름 없는 것";
  if(typeof p.origin !== "string") p.origin = "";
  if(!Array.isArray(p.roots)) p.roots = [];
  p.roots.forEach(stampNode);
  if(!p.createdAt) p.createdAt = now();
  if(!p.updatedAt) p.updatedAt = now();
  return p;
}
function save(touch){
  if(!APP) return;
  if(PJ && touch !== false) PJ.updatedAt = now();
  try{ localStorage.setItem(KEY, JSON.stringify(APP)); }
  catch(e){ toast("저장하지 못했습니다 — " + e.message); }
}
function load(){
  try{
    var s = localStorage.getItem(KEY);
    if(s){ var a = JSON.parse(s); if(a && a.projects){ a.projects.forEach(stampPj); return a; } }
  }catch(e){}
  return null;
}

/* ------------------------------ 나무 ------------------------------
   부모 번호를 가리키는 방식이 아니라 통째로 품는 방식이다.
   그래서 옮길 때 아래 달린 것이 저절로 따라오고, 끊길 선이 애초에 없다. */
function roots(){ return PJ ? PJ.roots : []; }
function find(id, list, parent){
  list = list || roots();
  for(var i=0;i<list.length;i++){
    if(list[i].id === id) return { node:list[i], list:list, i:i, parent:parent||null };
    var r = find(id, list[i].kids, list[i]);
    if(r) return r;
  }
  return null;
}
function chainTo(id){
  var out = [];
  (function dive(list, chain){
    list.forEach(function(n){
      if(n.id === id){ out = chain.slice(); }
      dive(n.kids, chain.concat([n]));
    });
  })(roots(), []);
  return out;
}
function all(list){
  var out = [];
  (function dive(l){ l.forEach(function(n){ out.push(n); dive(n.kids); }); })(list || roots());
  return out;
}
function isInside(a, b){                      /* b 가 a 의 자손인가 (자기 안에 못 넣게) */
  var hit = false;
  (function dive(l){ l.forEach(function(n){ if(n.id === b) hit = true; dive(n.kids); }); })(a.kids);
  return hit;
}
function kidsOf(id){ if(!id) return roots(); var f = find(id); return f ? f.node.kids : []; }
function count(list){
  var c = { think:0, set:0, made:0, total:0 };
  all(list).forEach(function(n){ c[n.state]++; c.total++; });
  return c;
}
function rate(n){
  var c = count(n.kids);
  if(!c.total) return n.state === "made" ? 1 : 0;
  return c.made / c.total;
}

function go(w){ document.body.dataset.at = w; }
function toast(m){
  var t = document.getElementById("toast");
  t.textContent = m; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("on"); }, 2600);
}

/* =========================================================================
   목록
   ========================================================================= */
function renderList(){
  var box = document.getElementById("pjList");
  box.innerHTML = "";
  if(!APP.projects.length){
    box.innerHTML = '<div class="none">아직 없습니다. 위 칸에 생각나는 대로 적어보세요.</div>';
    return;
  }
  APP.projects.slice().sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); })
   .forEach(function(p){
      var was = PJ; PJ = p; var c = count(p.roots); PJ = was;
      var wrap = document.createElement("div"); wrap.style.position = "relative";
      var b = document.createElement("button"); b.className = "pj";
      var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = p.title;
      var mi = document.createElement("span"); mi.className = "mini";
      STS.forEach(function(k){
        if(!c[k]) return;
        var s = document.createElement("span");
        s.style.color = COLOR[k]; s.title = LABEL[k];
        s.textContent = (k === "think" ? "생각 " : k === "set" ? "정함 " : "만듦 ") + c[k];
        mi.appendChild(s);
      });
      if(!c.total){ var e = document.createElement("span"); e.textContent = "비어 있음"; mi.appendChild(e); }
      b.appendChild(nm); b.appendChild(mi);
      b.onclick = function(){ open(p.id); };
      var x = document.createElement("button");
      x.className = "pjx"; x.textContent = "✕"; x.title = "지우기";
      x.onclick = function(ev){
        ev.stopPropagation();
        dlg({ title:"「" + p.title + "」 지우기", desc:"되돌릴 수 없습니다.", yes:"지우기",
              run:function(){ APP.projects = APP.projects.filter(function(q){ return q.id !== p.id; });
                              save(false); renderList(); } });
      };
      wrap.appendChild(b); wrap.appendChild(x); box.appendChild(wrap);
   });
}
/* 적은 글이 그대로 첫 뼈대가 된다. 들여쓴 줄은 안으로 들어간다 */
function fromText(text){
  var out = [], stack = [];
  String(text||"").split("\n").forEach(function(raw){
    if(!raw.trim()) return;
    var ind = (raw.match(/^[\t 　]*/)[0] || "").replace(/\t/g,"  ").replace(/　/g," ");
    var depth = Math.floor(ind.length / 2);
    var n = mkNode(raw.trim().replace(/^[-*•·]\s*/, ""), "think");
    while(stack.length > depth) stack.pop();
    if(!stack.length) out.push(n); else stack[stack.length-1].kids.push(n);
    stack.push(n);
  });
  return out;
}

/* =========================================================================
   조망판
   ========================================================================= */
function open(id){
  PJ = APP.projects.filter(function(p){ return p.id === id; })[0];
  if(!PJ) return;
  stampPj(PJ); FOCUS = null; SEL = null;
  go("board"); draw();
}
function draw(){
  if(!PJ) return;
  drawPath(); drawTally(); layout();
}
function drawPath(){
  var p = document.getElementById("path");
  p.innerHTML = "";
  var chain = FOCUS ? chainTo(FOCUS).concat([find(FOCUS).node]) : [];
  add(PJ.title, function(){ FOCUS = null; draw(); }, chain.length === 0, "");
  chain.forEach(function(n, i){
    var s = document.createElement("span"); s.className = "sep"; s.textContent = "›"; p.appendChild(s);
    add(n.name || "이름 없음", function(){ FOCUS = n.id; draw(); }, i === chain.length - 1, n.id);
  });
  function add(t, fn, nowHere){
    var b = document.createElement("button");
    b.textContent = t;
    /* 끌어다 여기 떨구면 그 층으로 올라간다.
       상자가 화면을 꽉 채우므로 「빈 곳」이 없어서, 밖으로 꺼낼 길이 따로 필요하다 */
    b.dataset.nid = arguments[3] || "";
    if(nowHere) b.className = "now"; else b.onclick = fn;
    p.appendChild(b);
  }
}
function drawTally(){
  var c = count(roots());
  var t = document.getElementById("tally");
  t.innerHTML = "";
  STS.forEach(function(k){
    var s = document.createElement("span"); s.title = LABEL[k];
    var i = document.createElement("i"); i.style.background = COLOR[k];
    if(k === "think") i.style.borderRadius = "50%";
    s.appendChild(i);
    s.appendChild(document.createTextNode(c[k]));
    t.appendChild(s);
  });
  document.getElementById("gauge").style.width = (c.total ? Math.round(c.made/c.total*100) : 0) + "%";
}

/* ---------------------------------------------------------------------------
   자리 잡기 — 사람이 배치하지 않는다. 면적을 나눠 갖는다.
   그래서 아무리 많아져도 화면을 넘지 않고, 스크롤이 없다.
   칸이 작아지면 상자 → 한 줄 칩 → 점 으로 줄어들되 사라지지는 않는다.
   --------------------------------------------------------------------------- */
var PLACED = [];
function layout(){
  var st = document.getElementById("stage");
  var cv = document.getElementById("canvas");
  cv.innerHTML = ""; PLACED = [];
  var W = st.clientWidth - 32, H = st.clientHeight - 32;
  if(W < 40 || H < 40) return;

  var list = kidsOf(FOCUS);
  if(!list.length){
    var e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = (FOCUS ? "여기는 아직 안 나눴습니다." : "아직 비어 있습니다.") +
      "<br><span style='color:var(--ink4);font-size:12px'>빈 곳을 누르면 새 상자가 생깁니다.</span>";
    cv.appendChild(e);
    return;
  }
  place(list, 0, 0, W, H, 0);
  PLACED.forEach(function(p){ cv.appendChild(p.el); });
  addPlus();
}
/* 남는 자리에 「＋」 하나. 빈 곳을 눌러도 된다 */
function addPlus(){
  var st = document.getElementById("stage");
  var W = st.clientWidth - 32, H = st.clientHeight - 32;
  var last = null;
  PLACED.forEach(function(p){ if(p.depth === 0) last = p; });
  if(!last) return;
  var x = last.x + last.w + 12, y = last.y, w = 118, h = Math.min(52, last.h);
  if(x + w > W){ x = last.x; y = last.y + last.h + 12; }
  if(y + h > H) return;
  var b = document.createElement("button");
  b.className = "plus";
  b.style.cssText = "left:" + x + "px;top:" + y + "px;width:" + w + "px;height:" + h + "px";
  b.textContent = "＋ 더하기";
  b.onclick = function(){ addKid(FOCUS); };
  document.getElementById("canvas").appendChild(b);
}

function place(list, x, y, w, h, depth){
  var n = list.length;
  var GAP = depth === 0 ? 12 : (depth === 1 ? 7 : 5);
  /* 화면 비율을 보고 칸 수를 정한다. 정사각에 가까울수록 읽기 쉽다 */
  var cols = Math.max(1, Math.min(n, Math.round(Math.sqrt(n * (w / Math.max(h, 1)) * 0.62))));
  var rowN = Math.ceil(n / cols);
  var base = Math.floor(n / rowN), extra = n % rowN;
  var ch = (h - GAP * (rowN - 1)) / rowN;
  var idx = 0, ry = y;
  for(var r = 0; r < rowN; r++){
    var cnt = base + (r < extra ? 1 : 0);
    if(cnt <= 0) continue;
    var cw = (w - GAP * (cnt - 1)) / cnt;
    var rx = x;
    for(var c = 0; c < cnt; c++){
      var node = list[idx++];
      emit(node, rx, ry, cw, ch, depth);
      rx += cw + GAP;
    }
    ry += ch + GAP;
  }
}
function emit(node, x, y, w, h, depth){
  var mode = (w < 70 || h < 22) ? "pip" : ((h < 54 || w < 104) ? "chip" : "box");
  var el, rec = { node:node, x:x, y:y, w:w, h:h, depth:depth, mode:mode };

  if(mode === "pip"){
    el = document.createElement("div");
    el.className = "pip";
    var s = Math.max(6, Math.min(w, h, 12));
    el.style.cssText = "left:" + (x + (w - s)/2) + "px;top:" + (y + (h - s)/2) + "px;width:" + s + "px;height:" + s + "px";
    el.style.setProperty("--c", COLOR[node.state]);
    el.title = (node.name || "이름 없음") + " — " + LABEL[node.state];
    el.onclick = function(ev){ ev.stopPropagation(); FOCUS = parentIdOf(node.id); SEL = node.id; draw(); };
  }
  else if(mode === "chip"){
    el = document.createElement("div");
    el.className = "chip" + (SEL === node.id ? " sel" : "");
    el.style.cssText = "left:" + x + "px;top:" + y + "px;width:" + w + "px;height:" + h + "px";
    el.style.setProperty("--c", COLOR[node.state]);
    var d = document.createElement("span"); d.className = "dot";
    d.style.setProperty("--c", COLOR[node.state]); d.title = LABEL[node.state];
    d.onclick = function(ev){ ev.stopPropagation(); cycle(node); };
    var t = document.createElement("span"); t.className = "t";
    t.contentEditable = "plaintext-only"; t.spellcheck = false; t.textContent = node.name;
    t.title = node.name;
    bindName(t, node);
    el.appendChild(d); el.appendChild(t);
    if(node.kids.length){
      var k = document.createElement("span"); k.className = "n"; k.textContent = node.kids.length;
      el.appendChild(k);
    }
  }
  else {
    el = document.createElement("div");
    el.className = "bx d" + Math.min(depth, 2) + (SEL === node.id ? " sel" : "");
    el.style.cssText = "left:" + x + "px;top:" + y + "px;width:" + w + "px;height:" + h + "px";
    el.style.setProperty("--c", COLOR[node.state]);

    var hd = document.createElement("div"); hd.className = "bh";
    var dot = document.createElement("span"); dot.className = "dot";
    dot.style.setProperty("--c", COLOR[node.state]); dot.title = LABEL[node.state] + " — 눌러서 바꾸기";
    dot.onclick = function(ev){ ev.stopPropagation(); cycle(node); };
    var nm = document.createElement("div"); nm.className = "nm";
    nm.contentEditable = "plaintext-only"; nm.spellcheck = false; nm.textContent = node.name;
    nm.title = node.name;                    /* 좁아서 잘렸을 때 전체를 볼 수 있게 */
    bindName(nm, node);
    hd.appendChild(dot); hd.appendChild(nm);

    if(node.kids.length){
      var c = count(node.kids);
      var mk = document.createElement("span"); mk.className = "mark";
      mk.innerHTML = "<b>" + c.made + "</b>/" + c.total;
      var bar = document.createElement("div"); bar.className = "bar";
      var bi = document.createElement("i"); bi.style.width = Math.round(rate(node)*100) + "%";
      bar.appendChild(bi);
      hd.appendChild(bar); hd.appendChild(mk);
    }
    var z = document.createElement("button");
    z.className = "zoom"; z.textContent = "⤢"; z.title = "이 안만 크게 보기";
    z.onclick = function(ev){ ev.stopPropagation(); FOCUS = node.id; SEL = null; draw(); };
    hd.appendChild(z);
    el.appendChild(hd);

    if(!node.kids.length && node.note && h > 58){
      var nt = document.createElement("div"); nt.className = "bnote";
      nt.contentEditable = "plaintext-only"; nt.spellcheck = false; nt.textContent = node.note;
      nt.addEventListener("input", function(){ node.note = nt.textContent; save(); });
      nt.addEventListener("mousedown", function(ev){ ev.stopPropagation(); });
      el.appendChild(nt);
    }
  }

  el.dataset.id = node.id;
  if(mode !== "pip") bindDrag(el, node);
  rec.el = el;
  /* 부모를 자식보다 «먼저» 등록해야 한다.
     나중에 등록하면 화면에 나중에 붙어서 부모가 자식을 덮어버린다. */
  PLACED.push(rec);

  /* 안에 든 것 — 자리가 남을 때만 그린다. 없어서 안 보이는 게 아니라 좁아서 접힌 것이다 */
  if(mode === "box" && node.kids.length){
    var HEAD = 30, innerH = h - HEAD - 8;
    if(innerH > 26 && w > 88){
      place(node.kids, x + 8, y + HEAD, w - 16, innerH, depth + 1);
    }else{
      var mk2 = document.createElement("div");
      mk2.className = "bnote";
      mk2.textContent = "안에 " + all(node.kids).length + "개";
      el.appendChild(mk2);
    }
  }
}
function parentIdOf(id){
  var ch = chainTo(id);
  return ch.length ? ch[ch.length-1].id : null;
}
function bindName(el, node){
  el.addEventListener("input", function(){ node.name = el.textContent; save(); });
  el.addEventListener("focus", function(){ SEL = node.id; });
  /* 여기서 mousedown 을 막으면 안 된다. 상자 머리의 대부분이 이름이라
     막아버리면 끌 곳이 사라진다. 누르기/끌기 구분은 bindDrag 이 한다. */
  el.addEventListener("keydown", function(ev){
    if(ev.key === "Enter"){ ev.preventDefault(); el.blur(); addSibling(node); }
    if(ev.key === "Escape"){ ev.preventDefault(); el.blur(); }
  });
}

/* ------------------------------ 고치기 (모드 없음) ------------------------------ */
function cycle(n){ n.state = STS[(STS.indexOf(n.state)+1)%3]; save(); draw(); }
function addKid(parentId){
  var fresh = mkNode("", "think");
  if(parentId){ var f = find(parentId); if(!f) return; f.node.kids.push(fresh); }
  else roots().push(fresh);
  save(); draw(); focusName(fresh.id);
}
function addSibling(n){
  var f = find(n.id); if(!f) return;
  var fresh = mkNode("", "think");
  f.list.splice(f.i + 1, 0, fresh);
  save(); draw(); focusName(fresh.id);
}
function focusName(id){
  setTimeout(function(){
    var el = document.querySelector('[data-id="' + id + '"]');
    if(!el) return;
    var t = el.querySelector(".nm") || el.querySelector(".t");
    if(!t) return;
    t.focus();
    var r = document.createRange(), s = window.getSelection();
    r.selectNodeContents(t); r.collapse(false);
    s.removeAllRanges(); s.addRange(r);
  }, 30);
}
function removeNode(n){
  var f = find(n.id); if(!f) return;
  var inside = all(n.kids).length;
  dlg({ title:"「" + (n.name || "이름 없음") + "」 지우기",
        desc: inside ? ("안에 있던 " + inside + "개는 버리지 않고 이 자리로 올라옵니다.") : "되돌릴 수 없습니다.",
        yes:"지우기",
        run:function(){
          var f2 = find(n.id); if(!f2) return;
          var args = [f2.i, 1].concat(n.kids);
          f2.list.splice.apply(f2.list, args);
          if(FOCUS === n.id) FOCUS = f2.parent ? f2.parent.id : null;
          SEL = null; save(); draw();
        } });
}

/* ------------------------------ 끌어서 옮기기 ------------------------------
   재우가 8/21에 요구한 것 — "가장 큰 상위 카테고리를 아래 카테고리로 자유롭게 움직일 수 있게끔.
   반대도 마찬가지." 즉 좌표를 옮기는 게 아니라 «위계»를 옮기는 것이다.
   품는 구조라서 아래 달린 것은 통째로 따라오고, 끊길 선이 없다. */
var DRAG = null;
function markSel(){
  PLACED.forEach(function(p){
    if(p.el && p.el.classList) p.el.classList.toggle("sel", p.node.id === SEL);
  });
}
function bindDrag(el, node){
  el.addEventListener("mousedown", function(e){
    if(e.button !== 0) return;
    if(e.target.closest("button")) return;
    if(e.target.classList.contains("dot")) return;      /* 동그라미는 상태 바꾸기다 */

    /* 이름 위에서 눌러도 끌 수 있어야 한다. 상자 머리의 대부분이 이름이라
       이름을 빼면 끌 곳이 거의 없다.
       누르고 «안 움직이면» 글자 편집, «움직이면» 옮기기로 갈라진다.

       이미 그 글자를 고치고 있는 중이면 손대지 않는다 — 그때는 글자를 끌어 고르는 게 맞다. */
    var fromText = !!e.target.isContentEditable;
    if(fromText && document.activeElement === e.target) return;
    /* 항상 막는다. 안 막으면 브라우저가 글자를 끌기 시작해서 마우스 신호를 가로챈다 */
    e.preventDefault();
    SEL = node.id; markSel();
    DRAG = { node:node, x0:e.clientX, y0:e.clientY, el:el, moved:false,
             fromText:fromText, textEl:fromText ? e.target : null };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
}
function onMove(e){
  if(!DRAG) return;
  if(!DRAG.moved){
    if(Math.abs(e.clientX-DRAG.x0) + Math.abs(e.clientY-DRAG.y0) < 5) return;
    DRAG.moved = true;
    DRAG.el.classList.add("drag");
    if(DRAG.fromText){                                   /* 글자 선택이 끌기를 방해하지 않게 */
      try{ if(document.activeElement) document.activeElement.blur(); }catch(err){}
      var s = window.getSelection(); if(s) s.removeAllRanges();
    }
  }
  e.preventDefault();
  document.querySelectorAll(".drop").forEach(function(x){ x.classList.remove("drop"); });
  DRAG.target = null; DRAG.up = null; DRAG.upSet = false;

  var over = document.elementFromPoint(e.clientX, e.clientY);
  var pb = over && over.closest ? over.closest("#path button") : null;
  if(pb){                                   /* 주소줄에 올리면 그 층으로 꺼낸다 */
    pb.classList.add("drop");
    DRAG.upSet = true;
    DRAG.up = pb.dataset.nid || null;
    return;
  }
  var t = hit(e.clientX, e.clientY);
  if(t && t.el) t.el.classList.add("drop");
  DRAG.target = t;
}
function onUp(){
  document.removeEventListener("mousemove", onMove);
  document.removeEventListener("mouseup", onUp);
  document.querySelectorAll(".drop").forEach(function(x){ x.classList.remove("drop"); });
  var d = DRAG; DRAG = null;
  if(!d) return;
  d.el.classList.remove("drag");
  /* 안 움직였으면 아무것도 안 바뀐 것이다.
     여기서 다시 그리면 눌린 요소가 사라져서 클릭이 씹힌다(상태 동그라미가 그랬다). */
  if(!d.moved){
    markSel();
    if(d.textEl){                       /* 누르기만 했으면 글자를 고치러 들어간다 */
      d.textEl.focus();
      try{
        var r = document.caretRangeFromPoint ? document.caretRangeFromPoint(d.x0, d.y0) : null;
        var s = window.getSelection();
        if(r && d.textEl.contains(r.startContainer)){ s.removeAllRanges(); s.addRange(r); }
      }catch(err){}
    }
    return;
  }

  var f = find(d.node.id); if(!f) return;

  /* 주소줄에 떨궜다 — 그 층으로 꺼낸다 */

  if(d.upSet){
    var dest = d.up ? find(d.up) : null;
    if(dest && (dest.node.id === d.node.id || isInside(d.node, dest.node.id))){ toast("자기 안으로는 못 넣습니다."); draw(); return; }
    f.list.splice(f.i, 1);
    if(dest) dest.node.kids.push(d.node); else roots().push(d.node);
    save(); draw();
    toast(dest ? ("「" + (dest.node.name || "이름 없음") + "」 층으로 꺼냈습니다.") : "맨 바깥으로 꺼냈습니다.");
    return;
  }

  var tgt = d.target;
  var into = tgt ? tgt.node : null;
  if(into && (into.id === d.node.id || isInside(d.node, into.id))){ toast("자기 안으로는 못 넣습니다."); draw(); return; }

  f.list.splice(f.i, 1);                       /* 아래 달린 것은 통째로 따라온다 */
  if(into){ into.kids.push(d.node); }
  else{ var host = FOCUS ? find(FOCUS).node.kids : roots(); host.push(d.node); }
  save(); draw();
  toast(into ? ("「" + (into.name || "이름 없음") + "」 안으로 옮겼습니다.") : "이 층에 두었습니다.");
}
/* 커서 밑에 있는 가장 안쪽 상자 */
function hit(cx, cy){
  var st = document.getElementById("stage").getBoundingClientRect();
  var x = cx - st.left - 16, y = cy - st.top - 16;
  var best = null;
  PLACED.forEach(function(p){
    if(p.mode === "pip") return;
    if(!DRAG) return;
    if(p.node.id === DRAG.node.id) return;
    if(isInside(DRAG.node, p.node.id)) return;      /* 자기 안으로는 못 넣는다. 미리 안 비춘다 */
    if(x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h){
      if(!best || p.depth > best.depth) best = p;
    }
  });
  return best;
}

/* ------------------------------ 빈 곳 · 단축키 ------------------------------ */
document.getElementById("stage").addEventListener("mousedown", function(e){
  if(e.target.id !== "stage" && e.target.id !== "canvas" && !e.target.classList.contains("empty")) return;
  e.preventDefault();
  SEL = null;
  addKid(FOCUS);
});
document.addEventListener("keydown", function(e){
  if(document.getElementById("dlg").classList.contains("on")){
    if(e.key === "Escape") dlgClose();
    return;
  }
  if(document.body.dataset.at !== "board") return;
  var edit = document.activeElement && document.activeElement.isContentEditable;
  if(e.key === "Escape"){
    if(edit){ document.activeElement.blur(); return; }
    if(FOCUS){ var ch = chainTo(FOCUS); FOCUS = ch.length ? ch[ch.length-1].id : null; draw(); }
    return;
  }
  if(edit) return;
  if((e.key === "Delete" || e.key === "Backspace") && SEL){
    e.preventDefault();
    var f = find(SEL); if(f) removeNode(f.node);
  }
});
var rz;
window.addEventListener("resize", function(){
  clearTimeout(rz);
  rz = setTimeout(function(){ if(document.body.dataset.at === "board" && PJ) layout(); }, 120);
});

/* =========================================================================
   겹창 · 백업 · 가져오기
   ========================================================================= */
var DLG = null;
function dlg(o){
  DLG = o;
  document.getElementById("dTitle").textContent = o.title || "";
  document.getElementById("dDesc").textContent = o.desc || "";
  var bd = document.getElementById("dBody"); bd.innerHTML = "";
  if(o.html) bd.innerHTML = o.html;
  if(o.input){
    var ta = document.createElement("textarea");
    ta.id = "dTa"; ta.value = o.value || "";
    if(o.readonly) ta.readOnly = true;
    bd.appendChild(ta);
  }
  var yes = document.getElementById("dYes");
  yes.textContent = o.yes || "확인";
  yes.classList.toggle("hidden", o.yes === false);
  document.getElementById("dlg").classList.add("on");
  document.getElementById("scrim").classList.add("on");
  if(o.input) setTimeout(function(){ var t = document.getElementById("dTa"); t.focus(); if(o.readonly) t.select(); }, 50);
}
function dlgClose(){
  document.getElementById("dlg").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
  DLG = null;
}
function copy(t){
  function fb(){
    var ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).catch(fb);
  else fb();
}
function readOld(){
  try{
    var s = localStorage.getItem(OLDKEY);
    if(!s) return null;
    var a = JSON.parse(s);
    return (a && a.projects) ? a : null;
  }catch(e){ return null; }
}
function importOld(){
  var old = readOld(); if(!old) return 0;
  var n = 0;
  (old.projects||[]).forEach(function(op){
    var by = {}, rs = [];
    (op.nodes||[]).forEach(function(o){
      /* 넷을 셋으로. 「만드는 중」은 아직 만들어진 게 아니므로 「정했음」이다 */
      var st = o.status === "done" ? "made" : (o.status === "set" || o.status === "doing") ? "set" : "think";
      var lines = [];
      if(o.what) lines.push(o.what);
      (o.decided||[]).forEach(function(t){ lines.push("· " + t); });
      (o.open||[]).forEach(function(t){ lines.push("? " + t); });    /* 하나도 안 버린다 */
      by[o.id] = { id:o.id, name:o.name||"", state:st, note:lines.join("\n"), kids:[] };
    });
    (op.nodes||[]).forEach(function(o){
      var me = by[o.id];
      if(o.parent && by[o.parent]) by[o.parent].kids.push(me); else rs.push(me);
    });
    var org = [];
    if(op.what) org.push(op.what);
    (op.open||[]).forEach(function(t){ org.push("? " + t); });
    APP.projects.push(stampPj({ title:op.title, origin:org.join("\n"), roots:rs,
                                createdAt:op.createdAt, updatedAt:op.updatedAt }));
    n++;
  });
  (old.ideas||[]).forEach(function(oi){
    var body = [oi.text || ""];
    (oi.notes||[]).forEach(function(x){ body.push(typeof x === "string" ? x : (x && (x.t||x.text) || "")); });
    (oi.open||[]).forEach(function(t){ body.push("? " + t); });
    var text = body.filter(Boolean).join("\n");
    APP.projects.push(stampPj({ title:oi.title || "쪽지", origin:text, roots:fromText(text) }));
    n++;
  });
  save(false);
  return n;
}

function on(id, ev, fn){ var e = document.getElementById(id); if(e) e.addEventListener(ev, fn); }
on("jotGo","click", function(){
  var ta = document.getElementById("jotIn"), t = ta.value.trim();
  if(!t){ toast("먼저 뭐라도 적어보세요."); return; }
  var rs = fromText(t);
  var p = stampPj({ title: rs.length ? rs[0].name : t.split("\n")[0], origin:t, roots:rs });
  APP.projects.push(p); save(false); ta.value = "";
  open(p.id); toast("펼쳐놨습니다. 이제 보면서 고치세요.");
});
on("jotIn","keydown", function(e){ if(e.key === "Enter" && (e.ctrlKey||e.metaKey)) document.getElementById("jotGo").click(); });
on("toList","click", function(){ PJ = null; FOCUS = null; renderList(); go("list"); });
on("btnOrigin","click", function(){
  if(!PJ) return;
  var esc = (PJ.origin || "").replace(/[<>&]/g, function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]; });
  dlg({ title:"처음 적은 글",
        desc:"「처음에 내가 뭐라고 생각했지?」 하고 돌아볼 때 보는 것입니다.\n지금 구조와 달라도 괜찮습니다. 생각은 바뀝니다.",
        html:'<div class="origin">' + (esc || "(없습니다)") + "</div>", yes:false });
});
on("btnImport","click", function(){
  var old = readOld();
  if(!old){ toast("첫 판에 저장된 내용이 없습니다."); return; }
  dlg({ title:"첫 판에서 가져오기",
        desc:"첫 판에 프로젝트 " + (old.projects||[]).length + "개, 아이디어 " + (old.ideas||[]).length + "개가 있습니다.\n\n" +
             "여기로 복사해옵니다. 첫 판 내용은 그대로 남습니다 — 읽기만 합니다.\n" +
             "적어두신 「정해진 것」과 「아직 안 정한 것」은 하나도 안 버립니다.",
        yes:"가져오기",
        run:function(){ var n = importOld(); renderList(); toast(n + "개를 가져왔습니다. 첫 판은 그대로 있습니다."); } });
});
on("btnBackup","click", function(){
  var s = JSON.stringify(APP);
  dlg({ title:"백업", desc:"아래 글을 어디든 붙여넣어 두세요.", input:true, readonly:true, value:s,
        yes:"복사하기", run:function(){ copy(s); toast("복사했습니다."); } });
});
on("btnRestore","click", function(){
  dlg({ title:"되살리기", desc:"지금 있는 것을 전부 덮어씁니다. 되돌릴 수 없습니다.", input:true, value:"",
        yes:"덮어쓰기",
        run:function(v){
          try{
            var a = JSON.parse(v);
            if(!a || !a.projects) throw new Error("형식이 다릅니다");
            a.projects.forEach(stampPj); APP = a; save(false); renderList(); toast("되살렸습니다.");
          }catch(e){ toast("되살리지 못했습니다 — " + e.message); }
        } });
});
on("dNo","click", dlgClose);
on("scrim","click", dlgClose);
on("dYes","click", function(){
  var o = DLG, ta = document.getElementById("dTa"), v = ta ? ta.value : "";
  dlgClose(); if(o && o.run) o.run(v);
});

/* ================================ 시작 ================================ */
APP = load();
if(!APP){
  APP = { projects:[] };
  var got = readOld() ? importOld() : 0;
  save(false);
  if(got) setTimeout(function(){ toast("첫 판에서 " + got + "개를 가져왔습니다. 첫 판 내용은 그대로 있습니다."); }, 500);
}
renderList();
go("list");
</script>
</body>
