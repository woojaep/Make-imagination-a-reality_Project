<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상상을 현실로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   상상을 현실로 — 두 번째 판

   왜 다시 만들었나 (CLAUDE.md 기준):
     원칙 15 는 "이 제품을 Infinite canvas 로 축소하지 말 것"을 금지 목록에 넣어뒀는데
     첫 판이 정확히 그것이었다. 네모 37개에 가로 6,948px — 열면 큰 그림이 하나도 안 보였다.
     구조가 커질수록 조망이 나빠지는 구조는 North Star 의 정반대다.

   그래서 이 판의 규칙은 셋이다.
     1. 가로 스크롤이 없다. 무엇을 보든 한 화면에 들어온다.
     2. 배치를 사람이 하지 않는다. 끌어다 놓는 건 그림 그리기지 생각 정리가 아니다.
     3. 「아직 모르는 것」이 화면에서 사라지지 않는다. 미정은 오류가 아니다(원칙 11).
   ========================================================================= */

:root{
  --paper:#FAFAF8;  --card:#FFFFFF;  --sunk:#F1F1EE;
  --ink:#1A1C1A;    --ink2:#5C6159;  --ink3:#8B9089;
  --line:#E3E4DF;   --line2:#CFD1CA;
  /* 상태색 — 첫 판에서 그대로 가져왔다. 재우가 이미 눈에 익힌 색이다 */
  --s-idea:#8FA88A;  --s-set:#5E86C4;  --s-doing:#D08A2C;  --s-done:#2F8F4E;
  --q:#C0553F;                       /* 아직 모르는 것 */
  --ai:#7B62C4;                      /* AI가 제안한 것 */
  --sh:0 1px 2px rgba(20,28,22,.05), 0 8px 20px -14px rgba(20,28,22,.25);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:14px; line-height:1.55;
  overflow:hidden;                   /* 가로 스크롤 금지는 이 제품의 기능이다 */
}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}

/* ---------- 공통 부품 ---------- */
.btn{
  border:1px solid var(--line2); background:var(--card); border-radius:8px;
  padding:7px 13px; font-size:13px; font-weight:500; white-space:nowrap;
  transition:background .12s, border-color .12s;
}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--ink); color:#fff; border-color:var(--ink)}
.btn.pri:hover{background:#000}
.btn.ghost{border-color:transparent; background:transparent; color:var(--ink2)}
.btn.ghost:hover{background:var(--sunk); color:var(--ink)}
.btn.sm{padding:4px 9px; font-size:12px; border-radius:6px}

.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--c,var(--line2))}
.st-idea{--c:var(--s-idea)} .st-set{--c:var(--s-set)}
.st-doing{--c:var(--s-doing)} .st-done{--c:var(--s-done)}

.hidden{display:none !important}

/* ---------- 화면 전환 ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column}
body[data-at="home"] #home{display:flex}
body[data-at="proj"] #proj{display:flex}
body[data-at="idea"] #idea{display:flex}

/* =========================  집 화면  ========================= */
#home{overflow-y:auto; overflow-x:hidden}
.hwrap{width:min(920px,92vw); margin:0 auto; padding:52px 0 80px}
.htitle{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.hsub{color:var(--ink3);font-size:13px;margin:0 0 30px}

.jot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;box-shadow:var(--sh)}
.jot h3{margin:0 0 10px;font-size:14px;font-weight:600}
.jot textarea{
  width:100%;min-height:74px;resize:vertical;border:1px solid var(--line);
  border-radius:9px;padding:11px 12px;background:var(--paper);outline:none;
}
.jot textarea:focus{border-color:var(--line2);background:#fff}
.jotfoot{display:flex;align-items:center;gap:10px;margin-top:9px}
.jotfoot .tip{color:var(--ink3);font-size:12px;flex:1}

.sect{margin-top:34px}
.sect h3{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.sect h3 .n{color:var(--ink3);font-weight:400}
.sect h3 .sp{flex:1}

.empty{border:1px dashed var(--line2);border-radius:12px;padding:26px;text-align:center;color:var(--ink3);font-size:13px}

.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.pwrap{position:relative}
.pcard{
  text-align:left;background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--c,var(--line2));border-radius:11px;padding:13px 14px;
  box-shadow:var(--sh);transition:transform .1s, border-color .12s;width:100%;
}
.pcard:hover{transform:translateY(-1px);border-color:var(--line2)}
.pcard .nm{font-weight:600;font-size:14px;margin-bottom:3px;padding-right:22px}
.pcard .de{color:var(--ink3);font-size:12px;line-height:1.5;min-height:18px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 원칙 4 — 카드에 다섯 가지를 늘어놓던 것을 둘로 줄였다. More information ≠ Better UI */
.pcard .mt{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:12px;color:var(--ink3)}
.pcard .qn{color:var(--q);font-weight:600}
.pmore{position:absolute;top:9px;right:8px;border:0;background:transparent;color:var(--ink3);
  border-radius:6px;padding:1px 6px;line-height:1.2}
.pmore:hover{background:var(--sunk);color:var(--ink)}

.icard{
  text-align:left;background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:12px 13px;box-shadow:var(--sh);
}
.icard:hover{border-color:var(--line2)}
.icard .nm{font-weight:500;font-size:13.5px}
.icard .mt{color:var(--ink3);font-size:12px;margin-top:4px}
.icard.fold{opacity:.5}

/* =========================  프로젝트 조망  ========================= */
#proj{overflow:hidden}

.top{
  display:flex;align-items:center;gap:10px;padding:11px 16px;
  border-bottom:1px solid var(--line);background:var(--card);flex:0 0 auto;
}
.crumb{display:flex;align-items:center;gap:2px;min-width:0;flex:1;overflow:hidden}
.crumb button{
  border:0;background:transparent;padding:4px 7px;border-radius:6px;font-size:13px;
  color:var(--ink2);max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.crumb button:hover{background:var(--sunk);color:var(--ink)}
.crumb .now{color:var(--ink);font-weight:600;cursor:default}
.crumb .now:hover{background:transparent}
.crumb .sep{color:var(--line2);font-size:11px;flex:0 0 auto}

.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:var(--card);padding:5px 11px;font-size:12.5px;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}

.body{display:flex;flex:1;min-height:0}

/* --- 가운데: 조망판 --- */
.stage{flex:1;min-width:0;display:flex;flex-direction:column;padding:18px 18px 0;overflow:hidden}
.stagehd{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;flex:0 0 auto}
.stagehd .tt{font-size:17px;font-weight:600;letter-spacing:-.01em}
.stagehd .wh{color:var(--ink2);font-size:12.5px;margin-top:2px;max-width:70ch}
.stagehd .sp{flex:1}

.grid{
  flex:1;min-height:0;display:grid;gap:var(--gap,12px);align-content:start;
  grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));
  overflow-y:auto;overflow-x:hidden;padding-bottom:16px;
}
/* 흐름형이면 순서가 보여야 한다(원칙 6). 격자는 그대로 두고 번호와 잇는 선만 더한다 */
.grid.flow .nd::before{
  content:attr(data-i);position:absolute;top:-7px;left:11px;
  background:var(--ink);color:#fff;font-size:10px;font-weight:600;
  width:17px;height:17px;border-radius:50%;display:grid;place-items:center;
}
.grid.flow .nd::after{
  content:"";position:absolute;top:50%;right:calc(var(--gap,12px) * -1);
  width:var(--gap,12px);height:1px;background:var(--line2);
}
.grid.flow .nd.rowend::after{display:none}

.nd{
  position:relative;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;box-shadow:var(--sh);
  display:flex;flex-direction:column;gap:6px;min-height:0;
  transition:transform .1s, border-color .12s, box-shadow .12s;
}
.nd:hover{transform:translateY(-1px);border-color:var(--line2)}
.nd.ai{border-style:dashed;border-color:var(--ai)}
.nd.sel{border-color:var(--ink);box-shadow:0 0 0 2px rgba(26,28,26,.08),var(--sh)}
.nd .hd{display:flex;align-items:center;gap:7px;min-width:0}
.nd .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd .wh{
  color:var(--ink3);font-size:12px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.nd .bar{height:3px;border-radius:2px;background:var(--sunk);overflow:hidden}
.nd .bar i{display:block;height:100%;background:var(--s-done);border-radius:2px}
.nd .ft{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--ink3);margin-top:auto}
.nd .q{color:var(--q);font-weight:600}
.nd .aitag{color:var(--ai);font-weight:600;font-size:11px}
/* 자리가 남으면 한 단계 아래 이름까지 보여준다.
   빈 칸을 늘리는 것보다 낫다 — 누르지 않고도 두 층을 같이 본다(원칙 5·13). */
.nd .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.nd .chip{
  display:flex;align-items:center;gap:4px;max-width:100%;
  font-size:11px;color:var(--ink2);background:var(--sunk);border-radius:5px;padding:2px 7px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.nd .chip i{width:5px;height:5px;border-radius:50%;background:var(--c,var(--line2));flex:0 0 auto}
.nd .chip.more{background:transparent;color:var(--ink3)}
/* 좁아지면 곁가지부터 접는다. 이해에 필요한 것만 남긴다(원칙 4) */
body[data-tight="1"] .nd .wh{-webkit-line-clamp:1}
body[data-tight="1"] .nd .chips{display:none}
body[data-tight="2"] .nd{padding:9px 11px;gap:4px}
body[data-tight="2"] .nd .wh,
body[data-tight="2"] .nd .chips{display:none}
body[data-tight="2"] .nd .nm{font-size:13px}

.addnd{
  border:1px dashed var(--line2);background:transparent;border-radius:12px;color:var(--ink3);
  font-size:13px;display:grid;place-items:center;min-height:54px;
}
.addnd:hover{background:var(--sunk);color:var(--ink2)}

.leaf{
  grid-column:1/-1;display:grid;place-items:center;color:var(--ink2);font-size:13px;
  text-align:center;padding:34px 10px;line-height:1.8;
}

/* --- 아래 띠: 구조와 진행을 같이 본다(원칙 13) --- */
.foot{
  display:flex;align-items:center;gap:14px;padding:9px 18px;
  border-top:1px solid var(--line);background:var(--card);flex:0 0 auto;font-size:12px;
}
.foot .leg{display:flex;align-items:center;gap:5px;color:var(--ink2)}
.foot .sp{flex:1}

/* --- 오른쪽: 아직 모르는 것. 절대 사라지지 않는다 --- */
.rail{
  width:290px;flex:0 0 auto;border-left:1px solid var(--line);background:var(--card);
  display:flex;flex-direction:column;min-height:0;
}
.railhd{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;flex:0 0 auto}
.railhd .t{font-size:13px;font-weight:600;color:var(--q)}
.railhd .n{margin-left:auto;font-size:12px;color:var(--ink3)}
.railwhy{padding:0 16px 10px;color:var(--ink3);font-size:11.5px;line-height:1.55;flex:0 0 auto}
.qlist{flex:1;min-height:0;overflow-y:auto;padding:0 12px 8px}
.qitem{
  display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;
  background:transparent;border:0;border-radius:8px;padding:8px;font-size:12.5px;line-height:1.5;
}
.qitem:hover{background:var(--sunk)}
.qitem .b{color:var(--q);flex:0 0 auto;margin-top:1px;font-weight:700}
.qitem .tx{flex:1;min-width:0}
.qitem .ow{display:block;color:var(--ink3);font-size:11px;margin-top:2px}
.railadd{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);flex:0 0 auto}
.railadd input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.5px;background:var(--paper);outline:none}
.railadd input:focus{border-color:var(--line2);background:#fff}

/* =========================  상세 패널  ========================= */
.scrim{position:fixed;inset:0;background:rgba(20,24,20,.18);opacity:0;pointer-events:none;transition:opacity .15s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.panel{
  position:fixed;top:0;right:0;bottom:0;width:min(430px,94vw);background:var(--card);
  border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;
  transform:translateX(101%);transition:transform .18s cubic-bezier(.4,0,.2,1);
  box-shadow:-8px 0 32px -20px rgba(20,28,22,.5);
}
.panel.on{transform:none}
.phd{display:flex;align-items:center;gap:8px;padding:13px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
.phd input{flex:1;min-width:0;border:1px solid transparent;background:transparent;font-size:15px;font-weight:600;padding:5px 7px;border-radius:7px;outline:none}
.phd input:hover{background:var(--sunk)}
.phd input:focus{background:#fff;border-color:var(--line2)}
.pbody{flex:1;overflow-y:auto;padding:14px 16px 22px}
.fld{margin-bottom:18px}
.fld>label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.fld .hint{color:var(--ink3);font-size:11.5px;font-weight:400;margin-left:6px}
.fld textarea{width:100%;min-height:62px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--paper);outline:none;font-size:13px}
.fld textarea:focus{border-color:var(--line2);background:#fff}
.sts{display:flex;gap:6px;flex-wrap:wrap}
.sts button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.sts button.on{border-color:var(--ink);background:var(--ink);color:#fff}

.lst{display:flex;flex-direction:column;gap:5px;margin-bottom:7px}
.li{display:flex;gap:8px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;line-height:1.5}
.li .tx{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.li .x{border:0;background:transparent;color:var(--ink3);padding:0 3px;border-radius:5px;flex:0 0 auto}
.li .x:hover{background:var(--sunk);color:var(--q)}
.li.q{border-color:#EBD3CD;background:#FDF7F5}
.li.q .tx::before{content:"? ";color:var(--q);font-weight:700}
.row{display:flex;gap:6px}
.row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;background:var(--paper);outline:none}
.row input:focus{border-color:var(--line2);background:#fff}

.kid{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px}
.kid:hover{border-color:var(--line2)}
.kid .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kid .q{color:var(--q);font-size:11px;font-weight:600}

.aibar{display:flex;align-items:center;gap:8px;background:#F5F2FC;border:1px solid #E0D8F4;border-radius:9px;padding:9px 11px;margin-bottom:16px;font-size:12.5px}
.aibar .t{flex:1;color:#5B49A0;line-height:1.5}
.pft{display:flex;gap:7px;padding:11px 14px;border-top:1px solid var(--line);flex:0 0 auto}

/* =========================  모달  ========================= */
.modal{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;
  width:min(620px,94vw);max-height:86vh;background:var(--card);border:1px solid var(--line2);
  border-radius:14px;box-shadow:0 24px 64px -24px rgba(20,28,22,.5);
  display:none;flex-direction:column;
}
.modal.on{display:flex}
.modal h3{margin:0;padding:16px 18px 0;font-size:15px;font-weight:600}
.modal .desc{padding:7px 18px 0;color:var(--ink2);font-size:12.5px;line-height:1.6;white-space:pre-wrap}
.modal .mb{padding:14px 18px 0;overflow-y:auto;flex:1;min-height:0}
.modal textarea{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:var(--paper);outline:none;font-size:12.5px;font-family:ui-monospace,Consolas,monospace;line-height:1.6}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px 16px}
.modal .mf .sp{flex:1}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:60;
  background:var(--ink);color:#fff;padding:10px 17px;border-radius:10px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* =========================  아이디어 쪽지  ========================= */
#idea{overflow-y:auto;overflow-x:hidden}
.iwrap{width:min(720px,92vw);margin:0 auto;padding:30px 0 80px}
.ibar{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.ibar .sp{flex:1}
.ibox{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 16px;margin-bottom:13px;box-shadow:var(--sh)}
.ibox h4{margin:0 0 9px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.ibox .otx{white-space:pre-wrap;font-size:13.5px;line-height:1.65}
#ideaTitle{width:100%;border:1px solid transparent;background:transparent;font-size:20px;font-weight:700;padding:5px 7px;border-radius:8px;outline:none;letter-spacing:-.01em;margin-bottom:12px}
#ideaTitle:hover{background:var(--sunk)}
#ideaTitle:focus{background:#fff;border-color:var(--line2)}

@media (max-width:900px){
  .rail{width:250px}
}
@media (max-width:700px){
  .rail{display:none}
}
</style>
</head>
<body data-at="home">

<!-- ==================== 집 ==================== -->
<div class="screen" id="home">
  <div class="hwrap">
    <h1 class="htitle">상상을 현실로</h1>
    <p class="hsub">머릿속에 있는 걸 꺼내서, 무엇을 아직 모르는지 보이게 하는 곳</p>

    <div class="jot">
      <h3>지금 뭐가 떠올랐나요?</h3>
      <textarea id="jotIn" placeholder="아무렇게나 적어도 됩니다. 문장이 아니어도 되고요."></textarea>
      <div class="jotfoot">
        <span class="tip">Ctrl+Enter</span>
        <button class="btn pri" id="jotAdd">아이디어로 담기</button>
      </div>
    </div>

    <div class="sect">
      <h3>아이디어 <span class="n" id="ideaN"></span></h3>
      <div class="cards" id="ideaList"></div>
    </div>

    <div class="sect">
      <h3>프로젝트 <span class="n" id="projN"></span><span class="sp"></span>
        <button class="btn sm" id="newProj">＋ 빈 프로젝트</button>
      </h3>
      <div class="cards" id="projList"></div>

<script>
"use strict";
/* =========================================================================
   저장

   첫 판은 localStorage["sulgyedo.v3"] 를 쓴다. 같은 file:// 이라 저장 칸을 공유한다.
   여기서 그 칸에 쓰면 재우의 원본이 덮인다. 그래서 이 판은 자기 칸만 쓰고
   첫 판 것은 읽기만 한다. 두 판을 나란히 켜놓고 비교할 수 있어야 한다.
   ========================================================================= */
var KEY    = "sangsang.v1";
var OLDKEY = "sulgyedo.v3";

var ST = {
  idea: {l:"생각 중",   c:"var(--s-idea)",  k:"st-idea"},
  set:  {l:"정해짐",    c:"var(--s-set)",   k:"st-set"},
  doing:{l:"만드는 중", c:"var(--s-doing)", k:"st-doing"},
  done: {l:"됐음",      c:"var(--s-done)",  k:"st-done"}
};
var ST_KEYS = ["idea","set","doing","done"];

var APP  = null;   /* {ideas:[], projects:[]} */
var PR   = null;   /* 지금 열어둔 프로젝트 */
var VIEW = null;   /* 지금 들여다보는 요소 id. null 이면 프로젝트 전체 */
var SEL  = null;   /* 상세 패널에 열린 요소 id */
var IDEA = null;

function uid(p){ return (p||"n") + Math.random().toString(36).slice(2,9); }
function now(){ return Date.now(); }

/* ---------------- 모양 갖추기 ---------------- */
function stampNode(n){
  if(!n.id) n.id = uid();
  if(!n.name) n.name = "이름 없음";
  if(!ST[n.status]) n.status = "idea";
  if(typeof n.what !== "string") n.what = "";
  if(!Array.isArray(n.decided)) n.decided = [];
  if(!Array.isArray(n.open)) n.open = [];
  if(typeof n.parent === "undefined") n.parent = null;
  if(typeof n.ai !== "boolean") n.ai = false;
  return n;
}
function stampProject(p){
  if(!p.id) p.id = uid("p");
  if(!p.title) p.title = "이름 없는 프로젝트";
  if(typeof p.what !== "string") p.what = "";
  if(!ST[p.status]) p.status = "doing";
  if(p.way !== "flow" && p.way !== "area") p.way = "area";
  if(typeof p.archived !== "boolean") p.archived = false;
  if(!Array.isArray(p.nodes)) p.nodes = [];
  if(!Array.isArray(p.open)) p.open = [];
  p.nodes.forEach(stampNode);
  if(!p.createdAt) p.createdAt = now();
  if(!p.updatedAt) p.updatedAt = now();
  return p;
}
function stampIdea(it){
  if(!it.id) it.id = uid("i");
  if(typeof it.text !== "string") it.text = "";
  if(!it.title) it.title = firstLine(it.text);
  if(!Array.isArray(it.notes)) it.notes = [];
  if(!Array.isArray(it.open)) it.open = [];
  if(typeof it.folded !== "boolean") it.folded = false;
  if(typeof it.projectId === "undefined") it.projectId = null;
  if(!it.createdAt) it.createdAt = now();
  return it;
}
function firstLine(t){
  var l = String(t||"").split("\n")[0].trim();
  if(!l) return "제목 없음";
  return l.length > 40 ? l.slice(0,40) + "…" : l;
}

function save(){
  if(!APP) return;
  if(PR) PR.updatedAt = now();
  saveQuiet();
}
/* 「마지막으로 본 곳」처럼 사람이 고친 게 아닌 것은 작업 시각을 건드리지 않는다.
   그냥 들여다본 것만으로 집 화면 순서가 바뀌면 안 된다. */
function saveQuiet(){
  if(!APP) return;
  try{ localStorage.setItem(KEY, JSON.stringify(APP)); }
  catch(e){ toast("저장하지 못했습니다 — " + e.message); }
}
function load(){
  try{
    var s = localStorage.getItem(KEY);
    if(s){
      var a = JSON.parse(s);
      if(a && a.projects){
        a.ideas = (a.ideas||[]).map(stampIdea);
        a.projects.forEach(stampProject);
        return a;
      }
    }
  }catch(e){}
  return null;
}

/* 첫 판에서 읽어온다. 절대 쓰지 않는다. */
function readOld(){
  try{
    var s = localStorage.getItem(OLDKEY);
    if(!s) return null;
    var a = JSON.parse(s);
    return (a && a.projects) ? a : null;
  }catch(e){ return null; }
}
function importOld(){
  var old = readOld();
  if(!old) return 0;
  var n = 0;
  (old.projects||[]).forEach(function(op){
    /* x·y·lv·fold 는 안 가져온다. 이 판에서 배치는 사용자 데이터가 아니다 */
    var p = stampProject({
      title: op.title, what: op.what, status: op.status, archived: op.archived,
      createdAt: op.createdAt, updatedAt: op.updatedAt,
      nodes: (op.nodes||[]).map(function(o){
        return stampNode({ id:o.id, name:o.name, what:o.what, status:o.status,
          decided:(o.decided||[]).slice(), open:(o.open||[]).slice(),
          parent:o.parent||null, ai:false });
      })
    });
    APP.projects.push(p); n++;
  });
  (old.ideas||[]).forEach(function(oi){
    APP.ideas.push(stampIdea({
      title: oi.title, text: oi.text, createdAt: oi.createdAt,
      notes: (oi.notes||[]).map(function(x){ return typeof x === "string" ? x : (x && (x.t || x.text) || ""); }),
      open: (oi.open||[]).slice()
    }));
  });
  save();
  return n;
}

/* ---------------- 나무 계산 ---------------- */
function N(id){
  if(!PR || !id) return null;
  for(var i=0;i<PR.nodes.length;i++) if(PR.nodes[i].id === id) return PR.nodes[i];
  return null;
}
function kidsOf(id){
  if(!PR) return [];
  var want = id || null;
  return PR.nodes.filter(function(n){ return (n.parent || null) === want; });
}
function ancestors(id){                       /* 가까운 것부터 */
  var out = [], n = N(id), g = 0;
  while(n && n.parent && g++ < 80){ n = N(n.parent); if(n) out.push(n); }
  return out;
}
function subtree(id){
  var out = [], stack = kidsOf(id).slice(), g = 0;
  while(stack.length && g++ < 8000){
    var n = stack.shift(); out.push(n);
    stack = stack.concat(kidsOf(n.id));
  }
  return out;
}
/* 진행률 — 끝가지(더 안 쪼갠 것)의 「됐음」 비율 */
function prog(id){
  var leaves = subtree(id).filter(function(n){ return kidsOf(n.id).length === 0; });
  if(!leaves.length){ var me = N(id); return (me && me.status === "done") ? 1 : 0; }
  var d = leaves.filter(function(n){ return n.status === "done"; }).length;
  return d / leaves.length;
}
function openCount(id){
  var me = N(id);
  var list = (me ? [me] : []).concat(subtree(id));
  var n = list.reduce(function(a, x){ return a + (x.open ? x.open.length : 0); }, 0);
  if(!id && PR) n += (PR.open || []).length;
  return n;
}
/* 화면에 상시로 띄울 미정 목록. 지금 보는 범위 안의 것만 */
function openList(id){
  var out = [], me = N(id);
  if(!id && PR) (PR.open||[]).forEach(function(t,i){ out.push({text:t, ownerId:null, owner:PR.title, i:i}); });
  (me ? [me] : []).concat(subtree(id)).forEach(function(n){
    (n.open||[]).forEach(function(t,i){ out.push({text:t, ownerId:n.id, owner:n.name, i:i}); });
  });
  return out;
}

/* ---------------- 잡동사니 ---------------- */
function go(where){ document.body.dataset.at = where; }
function toast(m){
  var t = document.getElementById("toast");
  t.textContent = m; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("on"); }, 2800);
}
function copy(t){
  function fb(){
    var ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).catch(fb);
  else fb();
}
function listBox(elId, arr, onDel, isQ, emptyText){
  var box = document.getElementById(elId);
  box.innerHTML = "";
  if(!arr || !arr.length){
    var e = document.createElement("div");
    e.style.cssText = "color:var(--ink3);font-size:12.5px;padding:3px 1px";
    e.textContent = emptyText || "없습니다.";
    box.appendChild(e); return;
  }
  arr.forEach(function(t, i){
    var li = document.createElement("div"); li.className = "li" + (isQ ? " q" : "");
    var tx = document.createElement("div"); tx.className = "tx"; tx.textContent = t;
    var x  = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.title = "지우기";
    x.onclick = function(){ onDel(i); };
    li.appendChild(tx); li.appendChild(x); box.appendChild(li);
  });
}

/* =========================================================================
   집 화면
   ========================================================================= */
function renderHome(){
  var il = document.getElementById("ideaList");
  il.innerHTML = "";
  if(!APP.ideas.length){
    il.innerHTML = '<div class="empty" style="grid-column:1/-1">아직 없습니다. 위 칸에 아무거나 적어보세요.</div>';
  }else{
    var open = APP.ideas.filter(function(i){ return !i.folded; });
    var fold = APP.ideas.filter(function(i){ return i.folded; });
    open.concat(fold).forEach(function(it){ il.appendChild(ideaCard(it)); });
  }
  document.getElementById("ideaN").textContent = APP.ideas.length ? APP.ideas.length + "개" : "";

  var live = APP.projects.filter(function(p){ return !p.archived; });
  var arc  = APP.projects.filter(function(p){ return p.archived; });

  var pl = document.getElementById("projList");
  pl.innerHTML = "";
  if(!live.length){
    pl.innerHTML = '<div class="empty" style="grid-column:1/-1">프로젝트가 없습니다.<br>아이디어를 프로젝트로 만들거나 빈 프로젝트로 시작하세요.</div>';
  }else{
    live.slice().sort(function(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); })
        .forEach(function(p){ pl.appendChild(projCard(p)); });
  }
  document.getElementById("projN").textContent = live.length ? live.length + "개" : "";

  var as = document.getElementById("arcSect"), al = document.getElementById("arcList");
  al.innerHTML = "";
  if(!arc.length){ as.classList.add("hidden"); }
  else{
    as.classList.remove("hidden");
    document.getElementById("arcN").textContent = arc.length + "개";
    arc.forEach(function(p){ al.appendChild(projCard(p)); });
  }
}
function ideaCard(it){
  var b = document.createElement("button");
  b.className = "icard" + (it.folded ? " fold" : "");
  var nm = document.createElement("div"); nm.className = "nm"; nm.textContent = it.title;
  var mt = document.createElement("div"); mt.className = "mt";
  var bits = [];
  if(it.open.length) bits.push("모르는 것 " + it.open.length);
  if(it.projectId)   bits.push("프로젝트가 됨");
  if(it.folded)      bits.push("접어둠");
  mt.textContent = bits.join(" · ") || "쪽지";
  b.appendChild(nm); b.appendChild(mt);
  b.onclick = function(){ openIdea(it.id); };
  return b;
}
function projCard(p){
  var was = PR; PR = p;                       /* 계산 함수들이 PR 을 본다 */
  var pc = Math.round(prog(null) * 100);
  var qn = openCount(null);
  PR = was;

  var wrap = document.createElement("div"); wrap.className = "pwrap";
  var b = document.createElement("button");
  b.className = "pcard"; b.style.setProperty("--c", ST[p.status].c);
  var nm = document.createElement("div"); nm.className = "nm"; nm.textContent = p.title;
  var de = document.createElement("div"); de.className = "de"; de.textContent = p.what || "";
  /* 원칙 4 — 다섯 가지를 늘어놓지 않는다. 「어디까지 왔나」와 「무엇을 모르나」면 된다 */
  var mt = document.createElement("div"); mt.className = "mt";
  var s1 = document.createElement("span"); s1.textContent = ST[p.status].l + " · " + pc + "%";
  mt.appendChild(s1);
  if(qn){
    var s2 = document.createElement("span"); s2.className = "qn";
    s2.textContent = "모르는 것 " + qn;
    mt.appendChild(s2);
  }
  b.appendChild(nm); b.appendChild(de); b.appendChild(mt);
  b.onclick = function(){ openProject(p.id); };

  var more = document.createElement("button");
  more.className = "pmore"; more.textContent = "⋯"; more.title = "상태 · 보관";
  more.onclick = function(e){ e.stopPropagation(); projMenu(p); };

  wrap.appendChild(b); wrap.appendChild(more);
  return wrap;
}
function projMenu(p){
  var next = ST_KEYS[(ST_KEYS.indexOf(p.status) + 1) % 4];
  ask({
    title: "「" + p.title + "」",
    desc: "지금 상태: " + ST[p.status].l + (p.archived ? "  (보관함에 있음)" : ""),
    ok: ST[next].l + " 으로 바꾸기",
    extra: p.archived ? "보관함에서 꺼내기" : "보관함에 넣기",
    onExtra: function(){ p.archived = !p.archived; save(); renderHome(); toast(p.archived ? "보관함에 넣었습니다." : "꺼냈습니다."); },
    run: function(){ p.status = next; save(); renderHome(); }
  });
}

/* =========================================================================
   아이디어 쪽지
   ========================================================================= */
function openIdea(id){
  IDEA = APP.ideas.filter(function(i){ return i.id === id; })[0];
  if(!IDEA) return;
  renderIdea(); go("idea");
}
function renderIdea(){
  if(!IDEA) return;
  document.getElementById("ideaTitle").value = IDEA.title;
  document.getElementById("ideaText").textContent = IDEA.text || "(비어 있음)";
  document.getElementById("ideaFold").textContent = IDEA.folded ? "다시 펴기" : "접어두기";
  listBox("ideaNotes", IDEA.notes, function(i){ IDEA.notes.splice(i,1); save(); renderIdea(); }, false);
  listBox("ideaOpens", IDEA.open,  function(i){ IDEA.open.splice(i,1);  save(); renderIdea(); }, true);
}
/* 아이디어 → 프로젝트.
   첫 판은 「큰 덩어리」를 사람이 직접 적는 화면을 하나 더 거치게 했다. 그 화면을 없앴다.
   원칙 7 — 처음부터 완벽한 지도를 만들지 않는다. 빈 지도로 시작해서 AI에게 묻거나
   직접 채우는 게 단계가 하나 적다. 적어둔 것은 하나도 안 버린다(원칙 8). */
function ideaToProject(){
  if(!IDEA) return;
  var p = stampProject({ title: IDEA.title, what: (IDEA.text||"").slice(0,200), status:"idea", nodes:[] });
  p.open = (IDEA.open || []).slice();
  (IDEA.notes || []).forEach(function(t){
    p.nodes.push(stampNode({ name: t.length > 28 ? t.slice(0,28) + "…" : t, what: t, status:"idea", parent:null }));
  });
  APP.projects.push(p);
  IDEA.projectId = p.id;
  save(); openProject(p.id);
  toast("프로젝트를 만들었습니다. 적어둔 것은 하나도 안 버렸습니다.");
}

/* =========================================================================
   프로젝트 조망 — 이 판의 핵심
   ========================================================================= */
function openProject(id){
  PR = APP.projects.filter(function(p){ return p.id === id; })[0];
  if(!PR) return;
  stampProject(PR);
  SEL = null;
  /* 원칙 14 — 다시 열었을 때 「내가 어디까지 생각했지?」를 되찾아 준다.
     맨 위로 되돌려 놓으면 지난번 자리를 매번 다시 찾아 들어가야 한다. */
  VIEW = (PR.cursor && N(PR.cursor)) ? PR.cursor : null;
  var resumed = !!VIEW;
  closePanel(true);
  go("proj"); renderProj();
  if(resumed) toast("지난번에 보던 「" + N(VIEW).name + "」 로 왔습니다. 맨 위는 주소줄에서.");
}
function renderProj(){
  if(!PR) return;
  if(PR.cursor !== VIEW){ PR.cursor = VIEW; saveQuiet(); }
  renderCrumb(); renderStage(); renderRail(); renderFoot();
  var seg = document.getElementById("waySeg");
  Array.prototype.forEach.call(seg.children, function(b){ b.classList.toggle("on", b.dataset.way === PR.way); });
}
function renderCrumb(){
  var c = document.getElementById("crumb");
  c.innerHTML = "";
  var chain = VIEW ? ancestors(VIEW).slice().reverse().concat([N(VIEW)]) : [];
  add(PR.title, function(){ VIEW = null; renderProj(); }, chain.length === 0);
  chain.forEach(function(n, i){
    if(!n) return;
    var sep = document.createElement("span"); sep.className = "sep"; sep.textContent = "›";
    c.appendChild(sep);
    add(n.name, function(){ VIEW = n.id; renderProj(); }, i === chain.length - 1);
  });
  function add(label, fn, isNow){
    var b = document.createElement("button");
    b.textContent = label;
    if(isNow) b.className = "now"; else b.onclick = fn;
    c.appendChild(b);
  }
}

/* 한 화면에 넣는다. 개수를 보고 칸 수와 빽빽함을 정한다.
   사용자가 배치를 정하지 않는다 — 그건 그림 그리기지 생각 정리가 아니다. */
function layout(n){
  var grid = document.getElementById("grid");
  var w = grid.clientWidth  || 900;
  var h = grid.clientHeight || 460;
  var cols;
  if(n <= 2)       cols = Math.max(1, n);
  else if(n <= 4)  cols = 2;
  else if(n <= 9)  cols = 3;
  else if(n <= 16) cols = 4;
  else             cols = Math.min(6, Math.ceil(Math.sqrt(n)));
  cols = Math.max(1, Math.min(cols, Math.floor(w / 190) || 1));
  var rows = Math.ceil((n + 1) / cols);
  var per = h / Math.max(1, rows);
  document.body.dataset.tight = String(per < 76 ? 2 : (per < 106 ? 1 : 0));
  grid.style.setProperty("--cols", cols);
  grid.style.setProperty("--gap", per < 76 ? "8px" : "12px");
  return cols;
}
function renderStage(){
  var here = VIEW ? N(VIEW) : null;
  document.getElementById("stTitle").textContent = here ? here.name : PR.title;
  document.getElementById("stWhat").textContent  = here ? (here.what || "") : (PR.what || "");
  document.getElementById("stOpen").classList.toggle("hidden", !here);

  var grid = document.getElementById("grid");
  grid.className = "grid" + (PR.way === "flow" ? " flow" : "");
  grid.innerHTML = "";

  var kids = kidsOf(VIEW);
  var cols = layout(kids.length);

  if(!kids.length){
    var e = document.createElement("div");
    e.className = "leaf";
    e.innerHTML = here
      ? "여기는 아직 안 쪼갰습니다.<br><span style='color:var(--ink3);font-size:12px'>더 나눌 게 있으면 아래 ＋ 로 더하세요.</span>"
      : "아직 비어 있습니다.<br><span style='color:var(--ink3);font-size:12px'>큰 덩어리부터 하나씩 더하거나, 위의 [AI에게 물어볼 것]으로 시작하세요.</span>";
    grid.appendChild(e);
  }
  kids.forEach(function(n, i){
    var atRowEnd = ((i + 1) % cols === 0) || (i === kids.length - 1);
    grid.appendChild(nodeCard(n, i, atRowEnd));
  });

  var add = document.createElement("button");
  add.className = "addnd"; add.textContent = "＋ 더하기";
  add.onclick = function(){ addNode(VIEW); };
  grid.appendChild(add);
}
function nodeCard(n, i, rowend){
  var kids = kidsOf(n.id);
  var b = document.createElement("button");
  b.className = "nd" + (n.ai ? " ai" : "") + (SEL === n.id ? " sel" : "") + (rowend ? " rowend" : "");
  b.dataset.i = i + 1;

  var hd = document.createElement("div"); hd.className = "hd";
  var d  = document.createElement("span"); d.className = "dot " + ST[n.status].k;
  var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = n.name;
  hd.appendChild(d); hd.appendChild(nm);
  if(n.ai){ var a = document.createElement("span"); a.className = "aitag"; a.textContent = "✨"; hd.appendChild(a); }
  b.appendChild(hd);

  if(n.what){ var wh = document.createElement("div"); wh.className = "wh"; wh.textContent = n.what; b.appendChild(wh); }

  if(kids.length){
    var bar = document.createElement("div"); bar.className = "bar";
    var ii  = document.createElement("i"); ii.style.width = Math.round(prog(n.id) * 100) + "%";
    bar.appendChild(ii); b.appendChild(bar);

    /* 한 단계 아래 이름. 좁아지면 CSS 가 알아서 접는다 */
    var chips = document.createElement("div"); chips.className = "chips";
    var show = kids.slice(0, 6);
    show.forEach(function(k){
      var c = document.createElement("span"); c.className = "chip";
      c.style.setProperty("--c", ST[k.status].c);
      var dot = document.createElement("i"); c.appendChild(dot);
      c.appendChild(document.createTextNode(k.name));
      chips.appendChild(c);
    });
    if(kids.length > show.length){
      var m = document.createElement("span"); m.className = "chip more";
      m.textContent = "+" + (kids.length - show.length);
      chips.appendChild(m);
    }
    b.appendChild(chips);
  }

  var ft = document.createElement("div"); ft.className = "ft";
  var s1 = document.createElement("span");
  s1.textContent = kids.length ? ("안에 " + kids.length + "개") : ST[n.status].l;
  ft.appendChild(s1);
  var q = openCount(n.id);
  if(q){ var s2 = document.createElement("span"); s2.className = "q"; s2.textContent = "? " + q; ft.appendChild(s2); }
  b.appendChild(ft);

  /* 규칙이 하나뿐이라 배울 게 없다 — 안에 뭐가 있으면 들어가고, 없으면 상세를 연다.
     AI 제안은 확인이 먼저다(원칙 9). */
  b.onclick = function(){
    if(n.ai){ openDetail(n.id); return; }
    if(kidsOf(n.id).length){ VIEW = n.id; SEL = null; closePanel(true); renderProj(); }
    else openDetail(n.id);
  };
  b.oncontextmenu = function(e){ e.preventDefault(); openDetail(n.id); };
  return b;
}
function addNode(parentId){
  var n = stampNode({ name:"새 요소", parent: parentId || null, status:"idea" });
  PR.nodes.push(n); save(); renderProj(); openDetail(n.id);
  setTimeout(function(){ var t = document.getElementById("dTitle"); t.focus(); t.select(); }, 200);
}

function openDetail(id){
  var n = N(id); if(!n) return;
  SEL = id;
  document.getElementById("dTitle").value = n.name;
  document.getElementById("dName").className = "dot " + ST[n.status].k;
  document.getElementById("dWhat").value = n.what || "";
  document.getElementById("dAiBar").classList.toggle("hidden", !n.ai);

  var sts = document.getElementById("dSts");
  sts.innerHTML = "";
  ST_KEYS.forEach(function(k){
    var b = document.createElement("button");
    if(n.status === k) b.className = "on";
    var d = document.createElement("span"); d.className = "dot " + ST[k].k;
    b.appendChild(d); b.appendChild(document.createTextNode(ST[k].l));
    b.onclick = function(){ n.status = k; save(); openDetail(id); };
    sts.appendChild(b);
  });

  listBox("dDecided", n.decided, function(i){ n.decided.splice(i,1); save(); openDetail(id); }, false, "아직 정한 게 없습니다.");
  listBox("dOpen",    n.open,    function(i){ n.open.splice(i,1);    save(); openDetail(id); }, true,  "걸리는 게 없습니다.");

  var kb = document.getElementById("dKids");
  kb.innerHTML = "";
  var kids = kidsOf(id);
  if(!kids.length){
    var e = document.createElement("div");
    e.style.cssText = "color:var(--ink3);font-size:12.5px;padding:3px 1px";
    e.textContent = "아직 안 쪼갰습니다.";
    kb.appendChild(e);
  }
  kids.forEach(function(k){
    var b = document.createElement("button"); b.className = "kid";
    var d = document.createElement("span"); d.className = "dot " + ST[k.status].k;
    var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = k.name;
    b.appendChild(d); b.appendChild(nm);
    var q = openCount(k.id);
    if(q){ var qq = document.createElement("span"); qq.className = "q"; qq.textContent = "? " + q; b.appendChild(qq); }
    b.onclick = function(){ openDetail(k.id); };
    kb.appendChild(b);
  });

  document.getElementById("panel").classList.add("on");
  document.getElementById("scrim").classList.add("on");
  renderStage(); renderRail(); renderFoot();
}
function closePanel(quiet){
  document.getElementById("panel").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
  var was = SEL; SEL = null;
  if(was && PR && !quiet){ renderStage(); renderRail(); renderFoot(); }
}

/* =========================================================================
   AI 왕복

   브라우저는 AI를 직접 못 부른다. 열쇠를 HTML 에 박는 방법은 쓰지 않는다 —
   유출되고, 한도를 「차단」이 아니라 「알림」으로밖에 못 건다.
   그래서 나가는 글과 돌아오는 글, 두 방향을 만든다. 첫 판에는 나가는 방향만 있었다.
   ========================================================================= */
function outline(id, depth){
  var out = [];
  kidsOf(id).forEach(function(n){
    var pad = new Array(depth + 1).join("  ");
    out.push(pad + "- " + n.name + " [" + ST[n.status].l + "]" + (n.what ? " — " + n.what : ""));
    (n.decided||[]).forEach(function(d){ out.push(pad + "  · 정함: " + d); });
    (n.open||[]).forEach(function(o){ out.push(pad + "  ? 모름: " + o); });
    out = out.concat(outline(n.id, depth + 1));
  });
  return out;
}
function askText(){
  var here = VIEW ? N(VIEW) : null;
  var L = [];
  L.push("아래는 내가 만들려는 것의 지금 상태다. 나는 개발자가 아니다.");
  L.push("");
  L.push("## 무엇을 만드나");
  L.push(PR.title + (PR.what ? " — " + PR.what : ""));
  if(here){
    L.push("");
    L.push("## 지금 보고 있는 곳");
    L.push(ancestors(here.id).slice().reverse().map(function(a){ return a.name; }).concat([here.name]).join(" > "));
    if(here.what) L.push(here.what);
  }
  L.push("");
  L.push("## 지금 있는 것");
  var body = outline(VIEW, 0);
  L.push(body.length ? body.join("\n") : "(아직 비어 있다)");
  var qs = openList(VIEW);
  if(qs.length){
    L.push("");
    L.push("## 내가 이미 «모른다»고 적어둔 것");
    qs.forEach(function(q){ L.push("- (" + q.owner + ") " + q.text); });
  }
  L.push("");
  L.push("## 부탁");
  L.push("1. 이 구조에서 내가 빠뜨린 것을 찾아라. 예쁘게 정리하지 말고 «빈틈»을 찾아라.");
  L.push("2. 질문은 최대 3개. 지금 정하지 않으면 전체 구조가 크게 달라지는 것부터.");
  L.push("3. 내가 분명히 정하지 않은 것을 정해진 것처럼 쓰지 마라. 모르는 건 모르는 채로 둬라.");
  L.push("4. 위에 이미 적어둔 것과 겹치는 질문은 하지 마라.");
  L.push("");
  L.push("## 답은 아래 세 줄 형식으로만. 다른 말은 붙이지 마라.");
  L.push("질문: (내가 아직 정하지 않은 것 한 줄)");
  L.push("제안: (넣을 자리 이름) > (새로 넣을 것 이름)");
  L.push("설명: (요소 이름) = (한 줄 설명)");
  L.push("");
  L.push("자리 이름은 위 목록에 있는 이름을 그대로 쓴다.");
  L.push("맨 바깥에 넣을 거면 자리 이름 자리에 「전체」 라고 쓴다.");
  return L.join("\n");
}
function findByName(name){
  name = String(name||"").trim().toLowerCase();
  if(!name || name === "전체" || name === "루트" || name === "root") return null;
  var hit = PR.nodes.filter(function(n){ return n.name.trim().toLowerCase() === name; });
  if(hit.length) return hit[0];
  hit = PR.nodes.filter(function(n){
    var a = n.name.toLowerCase();
    return a.indexOf(name) >= 0 || name.indexOf(a) >= 0;
  });
  return hit.length ? hit[0] : null;
}
function applyAnswer(text){
  var addQ = 0, addN = 0, addW = 0, miss = [];
  String(text||"").split("\n").forEach(function(raw){
    var line = raw.replace(/^\s*[-*•]\s*/, "").trim();
    var m = line.match(/^(질문|제안|설명)\s*[:：]\s*(.+)$/);
    if(!m) return;
    var kind = m[1], rest = m[2].trim();

    if(kind === "질문"){
      var owner = VIEW ? N(VIEW) : null;
      if(owner) owner.open.push(rest);
      else PR.open.push(rest);
      addQ++;
      return;
    }
    if(kind === "제안"){
      var gt = rest.indexOf(">");
      var pname = gt >= 0 ? rest.slice(0, gt) : "전체";
      var nname = (gt >= 0 ? rest.slice(gt + 1) : rest).trim();
      if(!nname) return;
      var parent = findByName(pname);
      if(gt >= 0 && !parent && pname.trim() !== "전체") miss.push(pname.trim());
      /* 원칙 9 — AI가 만든 것은 ai:true. 사용자가 확인해야 내 것이 된다 */
      PR.nodes.push(stampNode({ name:nname, parent: parent ? parent.id : (VIEW || null), status:"idea", ai:true }));
      addN++;
      return;
    }
    if(kind === "설명"){
      var eq = rest.indexOf("=");
      if(eq < 0) return;
      var target = findByName(rest.slice(0, eq));
      var desc = rest.slice(eq + 1).trim();
      if(target && desc && !target.what){ target.what = desc; addW++; }
    }
  });
  save(); renderProj();

  if(!addQ && !addN && !addW){
    toast("적용할 게 없었습니다. 「질문:」 「제안:」 「설명:」 로 시작하는 줄이 있어야 합니다.");
    return;
  }
  var msg = [];
  if(addQ) msg.push("모르는 것 " + addQ + "개");
  if(addN) msg.push("제안 " + addN + "개(✨)");
  if(addW) msg.push("설명 " + addW + "개");
  var t = msg.join(" · ") + " 담았습니다.";
  if(miss.length) t += "  자리를 못 찾은 이름: " + miss.slice(0,3).join(", ");
  toast(t);
}

var MODAL = null;

  MODAL = o;
  document.getElementById("mTitle").textContent = o.title || "";
  document.getElementById("mDesc").textContent  = o.desc  || "";
  var ta = document.getElementById("mTa");
  ta.classList.toggle("hidden", !o.input);
  ta.value = o.value || "";

  var ok = document.getElementById("mOk");
  ok.textContent = o.ok || "확인";
  var mf = ok.parentNode;
  var old = mf.querySelector(".extra"); if(old) old.remove();
  if(o.extra){
    var b = document.createElement("button");
    b.className = "btn extra"; b.textContent = o.extra;
    b.onclick = function(){ var f = o.onExtra; askClose(); if(f) f(); };
    mf.insertBefore(b, document.getElementById("mCancel"));
  }
  document.getElementById("modal").classList.add("on");
  document.getElementById("mScrim").classList.add("on");
  if(o.input) setTimeout(function(){ ta.focus(); if(o.readonly) ta.select(); }, 60);
}
function askClose(){
  document.getElementById("modal").classList.remove("on");
  document.getElementById("mScrim").classList.remove("on");
  MODAL = null;
}

});

/* 아이디어 */
on("ideaBack","click", function(){ IDEA = null; renderHome(); go("home"); });
on("ideaTitle","input", function(e){ if(IDEA){ IDEA.title = e.target.value || "제목 없음"; save(); } });
on("ideaFold","click", function(){ if(IDEA){ IDEA.folded = !IDEA.folded; save(); renderIdea(); } });
on("ideaToProj","click", ideaToProject);
on("ideaNoteAdd","click", function(){
  var i = document.getElementById("ideaNoteIn"), t = i.value.trim();
  if(t && IDEA){ IDEA.notes.push(t); i.value = ""; save(); renderIdea(); }
});
on("ideaNoteIn","keydown", function(e){ if(e.key === "Enter") document.getElementById("ideaNoteAdd").click(); });
on("ideaOpenAdd","click", function(){
  var i = document.getElementById("ideaOpenIn"), t = i.value.trim();
  if(t && IDEA){ IDEA.open.push(t); i.value = ""; save(); renderIdea(); }
});
on("ideaOpenIn","keydown", function(e){ if(e.key === "Enter") document.getElementById("ideaOpenAdd").click(); });

/* 프로젝트 */
on("toHome","click", function(){ PR = null; VIEW = null; closePanel(true); renderHome(); go("home"); });
on("stOpen","click", function(){ if(VIEW) openDetail(VIEW); });
document.getElementById("waySeg").addEventListener("click", function(e){
  var b = e.target.closest("button");
  if(b && PR){ PR.way = b.dataset.way; save(); renderProj(); }
});
on("qAdd","click", function(){
  var i = document.getElementById("qIn"), t = i.value.trim();
  if(!t || !PR) return;
  var owner = VIEW ? N(VIEW) : null;
  if(owner) owner.open.push(t); else PR.open.push(t);
  i.value = ""; save(); renderProj();
});
on("qIn","keydown", function(e){ if(e.key === "Enter") document.getElementById("qAdd").click(); });
on("btnAsk","click", function(){
  if(!PR) return;
  var t = askText();
  ask({ title:"AI에게 물어볼 것",
        desc:"아래를 통째로 복사해서 Claude Code(또는 다른 AI)에 붙여넣으세요.\n답이 오면 [AI 답변 붙여넣기]로 가져옵니다.",
        input:true, readonly:true, value:t, ok:"복사하기",
        run: function(){ copy(t); toast("복사했습니다. AI에 붙여넣으세요."); } });
});
on("btnPaste","click", function(){
  if(!PR) return;
  ask({ title:"AI 답변 붙여넣기",
        desc:"AI가 준 답을 그대로 붙여넣으세요.\n「질문:」은 «아직 모르는 것»으로, 「제안:」은 ✨ 표시가 붙은 요소로 들어갑니다.\n✨는 내가 확인하기 전까지 내 것이 아닙니다.",
        input:true, value:"", ok:"담기",
        run: function(v){ applyAnswer(v); } });
});

/* 상세 */
on("dClose","click", function(){ closePanel(); });
on("scrim","click", function(){ closePanel(); });
on("dTitle","input", function(e){ var n = N(SEL); if(n){ n.name = e.target.value || "이름 없음"; save(); renderStage(); renderCrumb(); renderRail(); } });
on("dWhat","input",  function(e){ var n = N(SEL); if(n){ n.what = e.target.value; save(); renderStage(); } });
on("dDecAdd","click", function(){
  var i = document.getElementById("dDecIn"), t = i.value.trim(), n = N(SEL);
  if(t && n){ n.decided.push(t); i.value = ""; save(); openDetail(n.id); }
});
on("dDecIn","keydown", function(e){ if(e.key === "Enter") document.getElementById("dDecAdd").click(); });
on("dOpenAdd","click", function(){
  var i = document.getElementById("dOpenIn"), t = i.value.trim(), n = N(SEL);
  if(t && n){ n.open.push(t); i.value = ""; save(); openDetail(n.id); }
});
on("dOpenIn","keydown", function(e){ if(e.key === "Enter") document.getElementById("dOpenAdd").click(); });
on("dKidAdd","click", function(){
  var i = document.getElementById("dKidIn"), t = i.value.trim(), n = N(SEL);
  if(t && n){
    PR.nodes.push(stampNode({ name:t, parent:n.id, status:"idea" }));
    i.value = ""; save(); openDetail(n.id);
  }
});
on("dKidIn","keydown", function(e){ if(e.key === "Enter") document.getElementById("dKidAdd").click(); });
on("dEnter","click", function(){ if(SEL){ VIEW = SEL; closePanel(true); renderProj(); } });
on("dAiKeep","click", function(){ var n = N(SEL); if(n){ n.ai = false; save(); openDetail(n.id); toast("내 것으로 옮겼습니다."); } });
on("dDel","click", function(){
  var n = N(SEL); if(!n) return;
  var kids = subtree(n.id);
  ask({ title:"「" + n.name + "」 지우기",
        desc: kids.length ? ("안에 있는 " + kids.length + "개도 같이 지워집니다. 되돌릴 수 없습니다.") : "되돌릴 수 없습니다.",
        ok:"지우기",
        run: function(){
          var kill = {}; kill[n.id] = 1; kids.forEach(function(k){ kill[k.id] = 1; });
          PR.nodes = PR.nodes.filter(function(x){ return !kill[x.id]; });
          if(VIEW && kill[VIEW]) VIEW = n.parent || null;
          closePanel(true); save(); renderProj();
        } });
});

/* 모달 */
on("mCancel","click", askClose);
on("mScrim","click", askClose);
on("mOk","click", function(){
  var o = MODAL, v = document.getElementById("mTa").value;
  askClose(); if(o && o.run) o.run(v);
});

/* 단축키 */
document.addEventListener("keydown", function(e){
  if(e.key !== "Escape") return;
  if(document.getElementById("modal").classList.contains("on")){ askClose(); return; }
  if(document.getElementById("panel").classList.contains("on")){ closePanel(); return; }
  if(document.body.dataset.at === "proj" && VIEW){
    var up = ancestors(VIEW)[0];
    VIEW = up ? up.id : null;
    renderProj();
  }
});
var rz;
window.addEventListener("resize", function(){
  clearTimeout(rz);
  rz = setTimeout(function(){ if(document.body.dataset.at === "proj" && PR) renderStage(); }, 120);
});

/* =========================================================================
   시작
   ========================================================================= */
APP = load();
if(!APP){
  APP = { ideas:[], projects:[] };
  /* 첫 실행에 첫 판 내용이 있으면 바로 가져온다.
     빈 화면을 띄우고 "가져오기를 누르세요"라고 하는 건 한 단계 더 시키는 것이다. */
  var got = readOld() ? importOld() : 0;
  save();
  if(got) setTimeout(function(){ toast("첫 판에서 " + got + "개를 가져왔습니다. 첫 판 내용은 그대로 있습니다."); }, 500);
}
renderHome();
go("home");
</script>
